tor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch8/Mixed%20Exercise%208.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 8 worked solutions (PDF)\">Mixed Exercise 8<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"step-past-papers.html\">STEP papers and solutions<\/a>.<\/p><\/div><\/details><section id=\"review-solutions\" class=\"textbook-section\"><h2>Review &amp; practice-paper solutions<\/h2><h3>Review Exercises: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Rev/Review%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Review Exercise 1 worked solutions (PDF)\">Review Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Rev/Review%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Review Exercise 2 worked solutions (PDF)\">Review Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><h3>Practice Exam Paper: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Prac/Practice%20Exam%20Paper%201.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper 1 worked solutions (PDF)\">Practice Exam Paper 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Prac/Practice%20Exam%20Paper%202.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper 2 worked solutions (PDF)\">Practice Exam Paper 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/section><\/div><\/div><p class=\"textbook-credit\">Textbooks and linked SolutionBank materials: Pearson Education, accessed through <a href=\"https://www.physicsandmathstutor.com/maths-revision/solutionbanks/edexcel-core-pure-maths-2/\">Physics &amp; Maths Tutor’s Edexcel SolutionBank<\/a>. Original practice questions, hints and explanations on this page: Arij Asad. This is an independent companion to the UK Edexcel 2017 series; match the chapter and exercise labels to your book. International A-level and older modular books use different numbering.<\/p><\/section>\n<section class=\"textbook-section\" id=\"practice\"><p class=\"topic-kicker\">Original practice by Arij Asad<\/p><h2>A short practice check<\/h2><p>Try these three questions before opening the hints. They sample a few useful skills; use them to choose what to revisit, rather than as a complete assessment of the book.<\/p><article class=\"practice-card\" id=\"question-1\"><div class=\"practice-head\"><h3>1. Roots of a complex number<\/h3><p>Find all three complex roots of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z<\/mi><mn>3<\/mn><\/msup><mo>=<\/mo><mn>8<\/mn><\/mrow><annotation encoding=\"application/x-tex\">z^3=8<\/annotation><\/semantics><\/math><\/span>, in the form <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">a+bi<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Write <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8<\/mn><mo>=<\/mo><mn>8<\/mn><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>k<\/mi><mi>π<\/mi><mi>i<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">8=8e^{2k\\pi i}<\/annotation><\/semantics><\/math><\/span>, then take cube roots with three distinct arguments.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>The roots have modulus <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>8<\/mn><mrow><mn>1<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><\/mrow><\/msup><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">8^{1/3}=2<\/annotation><\/semantics><\/math><\/span> and arguments <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>k<\/mi><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2k\\pi/3<\/annotation><\/semantics><\/math><\/span>, for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k<\/mi><mo>=<\/mo><mn>0<\/mn><mo separator=\"true\">,<\/mo><mn>1<\/mn><mo separator=\"true\">,<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">k=0,1,2<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Using <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>=<\/mo><mn>2<\/mn><mo stretchy=\"false\">(<\/mo><mi>cos<\/mi><mo>⁡<\/mo><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>k<\/mi><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>i<\/mi><mi>sin<\/mi><mo>⁡<\/mo><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>k<\/mi><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">z=2(\\cos(2k\\pi/3)+i\\sin(2k\\pi/3))<\/annotation><\/semantics><\/math><\/span> gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><msqrt><mn>3<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">-1+i\\sqrt3<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>1<\/mn><mo>−<\/mo><mi>i<\/mi><msqrt><mn>3<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">-1-i\\sqrt3<\/annotation><\/semantics><\/math><\/span>. These are distinct and account for all roots of the cubic.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo separator=\"true\">,<\/mo><mtext> <\/mtext><mo>−<\/mo><mn>1<\/mn><mo>+<\/mo><mi>i<\/mi><msqrt><mn>3<\/mn><\/msqrt><mo separator=\"true\">,<\/mo><mtext> <\/mtext><mo>−<\/mo><mn>1<\/mn><mo>−<\/mo><mi>i<\/mi><msqrt><mn>3<\/mn><\/msqrt><\/mrow><annotation encoding=\"application/x-tex\">2,\\ -1+i\\sqrt3,\\ -1-i\\sqrt3<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-2\"><div class=\"practice-head\"><h3>2. Hyperbolic functions<\/h3><p>Solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sinh<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>=<\/mo><mn>3<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sinh x=3/4<\/annotation><\/semantics><\/math><\/span> for real <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math><\/span>, giving an exact answer.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Use the exponential definition of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sinh<\/mi><mo>⁡<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\sinh x<\/annotation><\/semantics><\/math><\/span>, and set <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mo>=<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u=e^x&gt;0<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>−<\/mo><msup><mi>e<\/mi><mrow><mo>−<\/mo><mi>x<\/mi><\/mrow><\/msup><mo stretchy=\"false\">)<\/mo><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><mo>=<\/mo><mn>3<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(e^x-e^{-x})/2=3/4<\/annotation><\/semantics><\/math><\/span>. With <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mo>=<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u=e^x&gt;0<\/annotation><\/semantics><\/math><\/span>, this becomes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mo>−<\/mo><mn>1<\/mn><mi mathvariant=\"normal\">/<\/mi><mi>u<\/mi><mo>=<\/mo><mn>3<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u-1/u=3/2<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Multiplying by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>u<\/mi><\/mrow><annotation encoding=\"application/x-tex\">2u<\/annotation><\/semantics><\/math><\/span> gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><msup><mi>u<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>3<\/mn><mi>u<\/mi><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2u^2-3u-2=0<\/annotation><\/semantics><\/math><\/span>, or <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>u<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>u<\/mi><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(2u+1)(u-2)=0<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The root <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u=-1/2<\/annotation><\/semantics><\/math><\/span> is impossible because <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">e^x&gt;0<\/annotation><\/semantics><\/math><\/span>. Thus <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u=2<\/annotation><\/semantics><\/math><\/span>, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mi>ln<\/mi><mo>⁡<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=\\ln2<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mi>ln<\/mi><mo>⁡<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=\\ln2<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-3\"><div class=\"practice-head\"><h3>3. Second-order differential equations<\/h3><p>Solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y<\/mi><mrow><mo mathvariant=\"normal\">′<\/mo><mo mathvariant=\"normal\">′<\/mo><\/mrow><\/msup><mo>−<\/mo><mn>3<\/mn><msup><mi>y<\/mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′<\/mo><\/msup><mo>+<\/mo><mn>2<\/mn><mi>y<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y^{\\prime\\prime}-3y^{\\prime}+2y=0<\/annotation><\/semantics><\/math><\/span>, given <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y(0)=1<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y<\/mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′<\/mo><\/msup><mo stretchy=\"false\">(<\/mo><mn>0<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y^{\\prime}(0)=0<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Find the two auxiliary roots, then use both initial conditions to determine the constants.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>The auxiliary equation is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>m<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>3<\/mn><mi>m<\/mi><mo>+<\/mo><mn>2<\/mn><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi>m<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>m<\/mi><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">m^2-3m+2=(m-1)(m-2)=0<\/annotation><\/semantics><\/math><\/span>, giving distinct roots <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The general solution is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>A<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>+<\/mo><mi>B<\/mi><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">y=Ae^x+Be^{2x}<\/annotation><\/semantics><\/math><\/span>, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>y<\/mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′<\/mo><\/msup><mo>=<\/mo><mi>A<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>+<\/mo><mn>2<\/mn><mi>B<\/mi><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">y^{\\prime}=Ae^x+2Be^{2x}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The initial conditions give <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>+<\/mo><mi>B<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">A+B=1<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>+<\/mo><mn>2<\/mn><mi>B<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">A+2B=0<\/annotation><\/semantics><\/math><\/span>. Subtraction gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">B=-1<\/annotation><\/semantics><\/math><\/span>, then <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">A=2<\/annotation><\/semantics><\/math><\/span>. Hence <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>2<\/mn><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>−<\/mo><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">y=2e^x-e^{2x}<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>2<\/mn><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mo>−<\/mo><msup><mi>e<\/mi><mrow><mn>2<\/mn><mi>x<\/mi><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">y=2e^x-e^{2x}<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"find-the-mistake\"><div class=\"practice-head\"><h3>Find the mistake<\/h3><p>The curve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r<\/mi><mo>=<\/mo><mn>2<\/mn><mi>cos<\/mi><mo>⁡<\/mo><mi>θ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">r=2\\cos\\theta<\/annotation><\/semantics><\/math><\/span>, for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><mo>≤<\/mo><mi>θ<\/mi><mo>≤<\/mo><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">-\\pi/2\\leq\\theta\\leq\\pi/2<\/annotation><\/semantics><\/math><\/span>, traces a circle once. A student calculates its enclosed area as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mo>∫<\/mo><mrow><mo>−<\/mo><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><mrow><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><\/msubsup><mn>2<\/mn><mi>cos<\/mi><mo>⁡<\/mo><mi>θ<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>θ<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\int_{-\\pi/2}^{\\pi/2}2\\cos\\theta\\,\\mathrm{d}\\theta=4<\/annotation><\/semantics><\/math><\/span>. Identify the error and find the area.<\/p><\/div><div class=\"practice-body\"><details><summary>Show the correction<\/summary><div><p>The student has integrated <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r<\/mi><\/mrow><annotation encoding=\"application/x-tex\">r<\/annotation><\/semantics><\/math><\/span>; the correct area formula is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>∫<\/mo><msup><mi>r<\/mi><mn>2<\/mn><\/msup><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>θ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\tfrac12\\int r^2\\,\\mathrm{d}\\theta<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Here the area is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mtable rowspacing=\"0.25em\" columnalign=\"right left\" columnspacing=\"0em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mi>A<\/mi><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><msubsup><mo>∫<\/mo><mrow><mo>−<\/mo><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><mrow><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><\/msubsup><mn>4<\/mn><msup><mrow><mi>cos<\/mi><mo>⁡<\/mo><\/mrow><mn>2<\/mn><\/msup><mi>θ<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>θ<\/mi><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><msubsup><mo>∫<\/mo><mrow><mo>−<\/mo><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><mrow><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><\/msubsup><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mi>cos<\/mi><mo>⁡<\/mo><mn>2<\/mn><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>θ<\/mi><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><msubsup><mrow><mo fence=\"true\">[<\/mo><mi>θ<\/mi><mo>+<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mi>sin<\/mi><mo>⁡<\/mo><mn>2<\/mn><mi>θ<\/mi><mo fence=\"true\">]<\/mo><\/mrow><mrow><mo>−<\/mo><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><mrow><mi>π<\/mi><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><\/msubsup><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><mi>π<\/mi><mi mathvariant=\"normal\">.<\/mi><\/mrow><\/mstyle><\/mtd><\/mtr><\/mtable><annotation encoding=\"application/x-tex\">\\begin{aligned}A&amp;=\\frac12\\int_{-\\pi/2}^{\\pi/2}4\\cos^2\\theta\\,\\mathrm{d}\\theta\\\\&amp;=\\int_{-\\pi/2}^{\\pi/2}(1+\\cos2\\theta)\\,\\mathrm{d}\\theta\\\\&amp;=\\left[\\theta+\\frac12\\sin2\\theta\\right]_{-\\pi/2}^{\\pi/2}\\\\&amp;=\\pi.\\end{aligned}<\/annotation><\/semantics><\/math><\/span><\/p><p>As a check, multiplying the polar equation by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r<\/mi><\/mrow><annotation encoding=\"application/x-tex\">r<\/annotation><\/semantics><\/math><\/span> gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>2<\/mn><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x^2+y^2=2x<\/annotation><\/semantics><\/math><\/span>, or <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1<\/mn><msup><mo stretchy=\"false\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><msup><mi>y<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(x-1)^2+y^2=1<\/annotation><\/semantics><\/math><\/span>: a circle of radius <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1<\/annotation><\/semantics><\/math><\/span>, whose area is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\pi<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><aside class=\"textbook-note\"><h3>Use what you found<\/h3><ol><li>For complex roots, organise modulus and argument separately and check that you have found the required number of distinct roots.<\/li><li>Derive unfamiliar hyperbolic identities from exponentials instead of transferring trigonometric signs from memory.<\/li><li>Check differential-equation solutions twice: substitute into the equation and then verify every initial or boundary condition.<\/li><\/ol><\/aside><\/section>\n<section class=\"textbook-section\" id=\"downloads\"><h2>Take the practice into a lesson<\/h2><p>The printable sheet contains the questions first, followed by hints and full worked solutions. The editable LaTeX source is ready for Overleaf.<\/p><div class=\"download-row\"><a href=\"assets/textbook-practice/core-pure-2-practice.pdf\">Practice sheet &amp; solutions (PDF)<\/a><a href=\"assets/textbook-practice/edexcel-practice-overleaf.zip\" download>All six sheets for Overleaf (ZIP)<\/a><\/div><\/section><aside class=\"topic-tuition\"><div><h2>Specialist tuition and guided practice<\/h2><p>Individual online lessons, tailored problem sheets and structured practice between lessons, focused on the areas you need to strengthen.<\/p><\/div><a class=\"resource-button\" href=\"contact.html#enquiry-form\">Discuss your tuition package<\/a><\/aside><\/div><\/main>  <footer><div class=\"container footer-content\"><div><div class=\"footer-brand\">Arij Asad Maths<\/div><div>Specialist online mathematics tuition<\/div><\/div><div class=\"footer-links\"><a href=\"tuition.html\">Tuition<\/a><a href=\"resources.html\">Resources<\/a><a href=\"about.html\">About<\/a><a href=\"contact.html\">Contact<\/a><a href=\"privacy.html\">Privacy<\/a><a href=\"terms.html\">Terms<\/a><button class=\"cookie-settings-link\" type=\"button\" data-cookie-settings>Cookie settings<\/button><\/div><div>© 2026 Arij Asad Maths<\/div><\/div><\/footer>"},"resources.html":{"label":"Resources page","bodyClass":"resource-page resource-hub","html":"\n  <a class=\"skip-link\" href=\"#main-content\">Skip to main content<\/a>\n\n  <header class=\"site-header\">\n    <div class=\"container nav\">\n      <a class=\"brand\" href=\"/\">Arij Asad <span>Maths<\/span><\/a>\n      <button class=\"menu-button\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu<\/button>\n      <nav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Main navigation\">\n        <a href=\"/\">Home<\/a>\n        <a href=\"about.html\">About<\/a>\n        <a href=\"tuition.html\">Tuition<\/a>\n        <a href=\"tmua.html\">TMUA<\/a>\n        <a href=\"step.html\">STEP<\/a>\n        <a href=\"interviews.html\">Interviews<\/a>\n        <a href=\"maths-challenges.html\">Challenges<\/a>\n        <a href=\"university-maths.html\">University<\/a>\n        <a href=\"resources.html\" aria-current=\"page\">Resources<\/a>\n        <a href=\"zh.html\">中文<\/a>\n        <a class=\"nav-contact\" href=\"contact.html\">Contact<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n  <!-- Shared past-paper navigation -->\n  <nav class=\"paper-archive-bar\" aria-label=\"Past paper archives\">\n    <div class=\"paper-archive-bar__inner\">\n      <span class=\"paper-archive-bar__label\">Past paper archives<\/span>\n      <div class=\"paper-archive-bar__links\"><a href=\"/tmua-paper-archive.html\" aria-label=\"TMUA paper archive\">TMUA<\/a><a href=\"/mat-past-papers.html\" aria-label=\"MAT paper archive\">MAT<\/a><a href=\"/step-past-papers.html\" aria-label=\"STEP paper archive\">STEP<\/a><a href=\"/esat-paper-archive.html\" aria-label=\"ESAT paper archive\">ESAT<\/a><a href=\"/jmc-past-papers.html\" aria-label=\"JMC paper archive\">JMC<\/a><a href=\"/imc-past-papers.html\" aria-label=\"IMC paper archive\">IMC<\/a><a href=\"/smc-past-papers.html\" aria-label=\"SMC paper archive\">SMC<\/a><a href=\"/amc10-past-papers.html\" aria-label=\"AMC 10 paper archive\">AMC 10<\/a><a href=\"/amc12-past-papers.html\" aria-label=\"AMC 12 paper archive\">AMC 12<\/a><a href=\"/aime-past-papers.html\" aria-label=\"AIME paper archive\">AIME<\/a><a href=\"/bmo-past-papers.html\" aria-label=\"BMO paper archive\">BMO<\/a><\/div>\n    <\/div>\n  <\/nav>\n  <!-- /Shared past-paper navigation -->\n\n  <main id=\"main-content\">\n    <section class=\"resource-hero\">\n      <div class=\"container resource-hero__inner\">\n        <div class=\"eyebrow\">Free preparation resources<\/div>\n        <h1>Free maths past papers, solutions &amp; <span>grade boundaries.<\/span><\/h1>\n        <p class=\"resource-lede\">\n          Browse TMUA, historical MAT, STEP, ESAT and Olympiad resources, from official past papers\n          and community mocks to worked solutions and historical score thresholds.\n          Strengthen individual skills with my topic guides, worked examples and practice questions, alongside Cambridge Mathematics interview preparation.\n        <\/p>\n        <p class=\"resource-curator\">Curated by <a href=\"about.html\">Arij Asad<\/a>, Cambridge Mathematics graduate and STEP examiner. Papers and solutions are credited to their original authors.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"resource-section\">\n      <div class=\"container\">\n        <div class=\"resource-heading\">\n          <div class=\"eyebrow\">Papers and preparation guides<\/div>\n          <h2>Find your exam. <span>Plan your practice.<\/span><\/h2>\n          <p>\n            Each guide focuses on the decisions that make preparation effective:\n            sequencing work, analysing errors, writing clearly and learning to\n            respond productively when a problem is unfamiliar.\n          <\/p>\n        <\/div>\n\n        <div class=\"resource-grid\">\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">Edexcel textbook companions<\/div>\n            <h2>Chapter solutions and original practice<\/h2>\n            <p>Pure, Statistics &amp; Mechanics and Core Pure: find the matching textbook solutions, try a short practice check, and download a sheet with full explanations.<\/p>\n            <a class=\"text-link\" href=\"edexcel-textbook-companions.html\">Choose your Edexcel book →<\/a>\n          <\/article>\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">Maths topic practice<\/div>\n            <h2>Work on the step that keeps costing marks<\/h2>\n            <p>Modulus, algebra, sequences, calculus, geometry and counting: practical teaching guidance, worked examples and questions with hints and full solutions.<\/p>\n            <a class=\"text-link\" href=\"maths-topic-practice.html\">Choose a topic to practise →<\/a>\n          <\/article>\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">Historical MAT archive<\/div>\n            <h2>MAT papers, worked solutions and feedback<\/h2>\n            <p>Oxford papers, specimens and additional multiple-choice tests, with historical score averages. MAT is no longer held from 2026; these remain useful extra practice.<\/p>\n            <a class=\"text-link\" href=\"mat-past-papers.html\">Browse the MAT archive →<\/a>\n          <\/article>\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">STEP paper archive<\/div>\n            <h2>STEP 1, 2 and 3 past papers and solutions<\/h2>\n            <p>Historical papers, extended worked solutions and available S, 1, 2 and 3 grade boundaries, with Cambridge preparation resources.<\/p>\n            <a class=\"text-link\" href=\"step-past-papers.html\">Browse the STEP archive →<\/a>\n          <\/article>\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">ESAT practice archive<\/div>\n            <h2>ESAT, ENGAA, NSAA and PAT practice<\/h2>\n            <p>Official ESAT practice and relevant historical papers, answers and worked solutions, plus British Physics Olympiad resources.<\/p>\n            <a class=\"text-link\" href=\"esat-paper-archive.html\">Browse the ESAT archive →<\/a>\n          <\/article>\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">TMUA paper archive<\/div>\n            <h2>TMUA past papers, solutions and community mocks<\/h2>\n            <p>Question papers, worked solutions and historical raw totals for scores of 7, 8 and 9, plus JZ Maths, Gresty Academy, Beyond Horizon, Yotta and other community collections.<\/p>\n            <a class=\"text-link\" href=\"tmua-paper-archive.html\">Browse the full TMUA archive →<\/a>\n          <\/article>\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">Maths challenges and Olympiads<\/div>\n            <h2>JMC, IMC, SMC, AMC, AIME and BMO resources<\/h2>\n            <p>Past papers, solutions and award boundaries, organised by competition and year, together with individual tuition for students preparing for these challenges.<\/p>\n            <a class=\"text-link\" href=\"maths-challenges.html#papers\">Find papers and boundaries →<\/a>\n          <\/article>\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">TMUA guide<\/div>\n            <h2>How to prepare for TMUA: a 12-week study plan<\/h2>\n            <p>\n              A structured route from diagnostic work and topic repair to timed\n              practice, error analysis and final computer-based preparation.\n            <\/p>\n            <a class=\"text-link\" href=\"tmua-study-plan.html\">Read the TMUA study plan →<\/a>\n          <\/article>\n\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">STEP guide<\/div>\n            <h2>How to write a strong STEP solution<\/h2>\n            <p>\n              What a complete mathematical argument needs, how to make progress\n              visible and why checking structure matters as much as reaching an answer.\n            <\/p>\n            <a class=\"text-link\" href=\"strong-step-solution.html\">Read the STEP solution guide →<\/a>\n          <\/article>\n\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">STEP planning<\/div>\n            <h2>When should you start preparing for STEP?<\/h2>\n            <p>\n              A realistic preparation timeline for students at different stages,\n              from early problem-solving development to offer-holder preparation.\n            <\/p>\n            <a class=\"text-link\" href=\"when-to-start-step.html\">Plan your STEP preparation →<\/a>\n          <\/article>\n\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">Cambridge interviews<\/div>\n            <h2>What happens in a Cambridge maths interview?<\/h2>\n            <p>\n              How mathematical discussion, hints and unfamiliar questions work,\n              with practical ways to practise explaining reasoning aloud.\n            <\/p>\n            <a class=\"text-link\" href=\"cambridge-maths-interview-guide.html\">Read the interview guide →<\/a>\n          <\/article>\n\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">TMUA practice<\/div>\n            <h2>How to use TMUA past papers effectively<\/h2>\n            <p>\n              A practical system for diagnosing errors, revisiting questions and\n              protecting enough papers for realistic timed practice.\n            <\/p>\n            <a class=\"text-link\" href=\"tmua-past-papers.html\">Use past papers purposefully →<\/a>\n          <\/article>\n\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">TMUA logic<\/div>\n            <h2>TMUA Paper 2: logic and proof explained<\/h2>\n            <p>\n              A clear guide to implication, converses, contrapositives,\n              counterexamples and necessary and sufficient conditions.\n            <\/p>\n            <a class=\"text-link\" href=\"tmua-logic-proof.html\">Strengthen logic and proof →<\/a>\n          <\/article>\n\n          <article class=\"resource-card\">\n            <div class=\"resource-card__label\">Interview practice<\/div>\n            <h2>Five Cambridge maths interview practice problems<\/h2>\n            <p>\n              Five discussion-led problems with graduated hints and solution\n              outlines for practising mathematical communication.\n            <\/p>\n            <a class=\"text-link\" href=\"cambridge-interview-problems.html\">Try the practice problems →<\/a>\n          <\/article>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"resource-section resource-section--dark\" id=\"official-resources\">\n      <div class=\"container\">\n        <div class=\"resource-heading\">\n          <div class=\"eyebrow\">Official materials<\/div>\n          <h2>Start with the <span>authoritative sources.<\/span><\/h2>\n          <p>\n            These links go directly to the organisations responsible for the\n            assessments or to the University of Cambridge. Papers remain on the\n            official sites rather than being copied here.\n          <\/p>\n        <\/div>\n\n        <div class=\"official-grid\">\n          <a class=\"official-link\" href=\"https://esat-tmua.ac.uk/tmua-preparation-materials/\" target=\"_blank\" rel=\"noopener\">\n            <small>UAT-UK<\/small>\n            <strong>TMUA preparation materials<\/strong>\n            <span>Historic papers, answer keys, worked answers and official preparation material.<\/span>\n          <\/a>\n\n          <a class=\"official-link\" href=\"https://esat-tmua.ac.uk/prepare/\" target=\"_blank\" rel=\"noopener\">\n            <small>UAT-UK<\/small>\n            <strong>TMUA specification and practice tests<\/strong>\n            <span>Current specification, computer-based practice and Notes on Mathematics and Logic.<\/span>\n          <\/a>\n\n          <a class=\"official-link\" href=\"https://step.maths.org/home\" target=\"_blank\" rel=\"noopener\">\n            <small>University of Cambridge<\/small>\n            <strong>STEP Support Programme<\/strong>\n            <span>Free foundation, STEP 2 and STEP 3 modules with hints and full solutions.<\/span>\n          <\/a>\n\n          <a class=\"official-link\" href=\"https://step.maths.org/questions\" target=\"_blank\" rel=\"noopener\">\n            <small>STEP Support Programme<\/small>\n            <strong>STEP question database<\/strong>\n            <span>Search past questions by paper, year or topic and find available mark schemes.<\/span>\n          <\/a>\n\n          <a class=\"official-link\" href=\"https://www.ocr.org.uk/students/step-mathematics/preparing-for-step/\" target=\"_blank\" rel=\"noopener\">\n            <small>OCR<\/small>\n            <strong>Preparing for STEP<\/strong>\n            <span>Official examination information and links to preparation support.<\/span>\n          <\/a>\   <script>
    (() => {
      const root = document.getElementById('edexcel-review');
      const data = JSON.parse(root.querySelector('#edexcel-review-data').textContent);
      const picker = root.querySelector('#edexcel-review-page');
      const content = root.querySelector('#edexcel-review-content');
      let current = data.home;
      for (const [path, page] of Object.entries(data.pages)) {
        const option = document.createElement('option');
        option.value=path;option.textContent=page.label;picker.appendChild(option);
      }
      function anchor(hash) {
        if (!hash) return;
        let id;try{id=decodeURIComponent(hash.slice(1));}catch(_){return;}
        const target=content.querySelector('[id="'+CSS.escape(id)+'"]');
        if(target){if(target.matches('details'))target.open=true;target.scrollIntoView({block:'start'});}
      }
      function show(path,hash='',scroll=true) {
        if(!data.pages[path]) return;
        current=path;picker.value=path;
        content.className='review-page '+data.pages[path].bodyClass;
        content.innerHTML=data.pages[path].html;
        content.querySelectorAll('a[href]').forEach(a=>{
          const u=new URL(a.getAttribute('href'),'https://maths.arijasad.com/'+path);
          if(u.protocol==='https:' && (u.origin!=='https://maths.arijasad.com'||(!data.pages[u.pathname.slice(1)]&&!data.downloads[u.pathname.slice(1)]))){a.href=u.href;a.target='_blank';a.rel='noopener';}
        });
        if(hash)anchor(hash);else if(scroll)root.scrollIntoView({block:'start'});
      }
      function download(path) {
        const f=data.downloads[path];if(!f)return;
        const bytes=Uint8Array.from(atob(f.data),c=>c.charCodeAt(0));
        const url=URL.createObjectURL(new Blob([bytes],{type:f.type}));
        const a=document.createElement('a');a.href=url;a.download=path.split('/').pop();a.click();
        setTimeout(()=>URL.revokeObjectURL(url),30000);
      }
      picker.addEventListener('change',()=>show(picker.value));
      content.addEventListener('click',event=>{
        const button=event.target.closest('.menu-button');
        if(button){const nav=content.querySelector('.nav-links');const open=nav.classList.toggle('open');button.setAttribute('aria-expanded',String(open));return;}
        const a=event.target.closest('a[href]');if(!a)return;
        const raw=a.getAttribute('href');
        if(raw.startsWith('#')){event.preventDefault();anchor(raw);return;}
        const url=new URL(raw,'https://maths.arijasad.com/'+current);
        const path=url.pathname.slice(1);
        if(url.origin==='https://maths.arijasad.com'&&data.pages[path]){event.preventDefault();show(path,url.hash);}
        else if(url.origin==='https://maths.arijasad.com'&&data.downloads[path]){event.preventDefault();download(path);}
      });
      show(data.home,'',false);
    })();
