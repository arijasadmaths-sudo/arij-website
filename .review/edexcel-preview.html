<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edexcel companions — draft preview</title><style>body{margin:0}</style></head><body><div id="edexcel-review">
  <style>
    #edexcel-review {
  --black: #111111;
  --charcoal: #1b1b1b;
  --cream: #f7f5f0;
  --cream-dark: #eee8dc;
  --white: #ffffff;
  --gold: #72531c;
  --gold-light: #ead9b6;
  --text: #1c1c1c;
  --muted: #656565;
  --border: #e3dccf;
  --shadow: 0 18px 50px rgba(20, 20, 20, 0.08);
  --radius: 22px;
  --max-width: 1180px;
}

img {
  display: block;
  max-width: 100%;
}

body:not(.resource-page) .nav-links {
  gap: 18px;
}

.site-media {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--white);
  box-shadow: var(--shadow);
}

.site-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.site-media figcaption {
  padding: 12px 16px;
  color: var(--muted);
  font-size: 13px;
}

.teaching-proof {
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
  align-items: stretch;
  gap: 0;
  max-width: 1040px;
  margin-right: auto;
  margin-left: auto;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--white);
  box-shadow: var(--shadow);
}

.teaching-proof__image {
  display: flex;
  align-items: center;
  background: var(--cream-dark);
}

.teaching-proof__image img {
  width: 100%;
  height: auto;
}

.teaching-proof__content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(34px, 5vw, 70px);
}

.teaching-proof__content h2 {
  margin: 0 0 20px;
  color: var(--black);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(34px, 4vw, 54px);
  line-height: 1.06;
  letter-spacing: -1.5px;
}

.teaching-proof__content p {
  margin: 0 0 18px;
  color: var(--muted);
}

.image-split {
  display: grid;
  grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr);
  align-items: center;
  gap: clamp(34px, 6vw, 76px);
}

.image-split--reverse {
  grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
}

.portrait-media {
  aspect-ratio: 3 / 4;
}

.landscape-media {
  aspect-ratio: 16 / 10;
}

.research-media {
  aspect-ratio: 5 / 4;
  background: #07110b;
}

.research-media img {
  object-position: center;
}

.guidance-actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
}

.guidance-actions .button {
  min-width: 0;
  max-width: 100%;
  text-align: center;
  white-space: normal;
}

/* Shared resources and article pages */

.resource-page {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.68;
}

.resource-page * {
  box-sizing: border-box;
}

.resource-page html {
  scroll-behavior: smooth;
}

.resource-page a {
  color: inherit;
}

.resource-page .container {
  width: min(calc(100% - 40px), var(--max-width));
  margin: 0 auto;
}

.resource-page .skip-link {
  position: absolute;
  top: -100px;
  left: 20px;
  z-index: 9999;
  padding: 12px 18px;
  border-radius: 8px;
  background: var(--black);
  color: var(--white);
}

.resource-page .skip-link:focus {
  top: 20px;
}

.resource-page .site-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  border-bottom: 1px solid rgba(180, 138, 60, 0.18);
  background: rgba(247, 245, 240, 0.95);
  backdrop-filter: blur(14px);
}

.resource-page .nav {
  display: flex;
  min-height: 76px;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}

.resource-page .brand {
  color: var(--black);
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.5px;
  text-decoration: none;
  white-space: nowrap;
}

.resource-page .brand span {
  color: var(--gold);
}

.resource-page .nav-links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.resource-page .nav-links a {
  color: #333333;
  font-size: 14px;
  font-weight: 650;
  text-decoration: none;
}

.resource-page .nav-links a:hover,
.resource-page .nav-links a:focus-visible,
.resource-page .nav-links a[aria-current="page"] {
  color: var(--gold);
}

.resource-page .nav-contact {
  padding: 10px 17px;
  border-radius: 999px;
  background: var(--black);
  color: var(--white) !important;
}

.resource-page .menu-button {
  display: none;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--white);
  color: var(--black);
  font: inherit;
  font-weight: 700;
}

.resource-hero {
  position: relative;
  overflow: hidden;
  padding: 96px 0 82px;
  background:
    radial-gradient(circle at 86% 22%, rgba(180, 138, 60, 0.18), transparent 27%),
    var(--cream);
}

.resource-hero::after {
  content: "∴";
  position: absolute;
  top: 10px;
  right: 5%;
  color: rgba(180, 138, 60, 0.08);
  font-family: Georgia, serif;
  font-size: clamp(180px, 25vw, 340px);
  line-height: 1;
  pointer-events: none;
}

.resource-hero__inner {
  position: relative;
  z-index: 1;
  max-width: 850px;
}

.section-dark .eyebrow,
.contact-box .eyebrow {
  color: #ead9b6;
}

.resource-page .eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  color: #6f511b;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-transform: uppercase;
}

.resource-page .eyebrow::before {
  width: 32px;
  height: 2px;
  background: var(--gold);
  content: "";
}

.resource-page h1,
.resource-page h2,
.resource-page h3 {
  color: var(--black);
}

.resource-page h1,
.resource-page h2 {
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing: -1.5px;
}

.resource-page h1 {
  max-width: 820px;
  margin: 0 0 24px;
  font-size: clamp(48px, 7vw, 84px);
  line-height: 0.98;
}

.resource-page h1 span,
.resource-page h2 span {
  color: var(--gold);
}

.resource-lede {
  max-width: 760px;
  margin: 0;
  color: #565656;
  font-size: clamp(18px, 2.1vw, 22px);
}

.resource-hub .resource-hero { padding: 56px 0 48px; }
.resource-hub .resource-hero__inner { max-width: 1000px; }
.resource-hub h1 { max-width: 960px; font-size: clamp(2.25rem, 5vw, 4.2rem); line-height: 1.08; }
.resource-hub .resource-curator { max-width: 760px; margin: 20px 0 0; color: #565656; font-size: 1rem; }
.resource-hub .resource-curator a { color: #72531c; text-underline-offset: 3px; }

.resource-section {
  padding: 86px 0;
}

.resource-section--white {
  background: var(--white);
}

.resource-section--dark {
  background: var(--black);
  color: rgba(255, 255, 255, 0.76);
}

.resource-section--dark h2,
.resource-section--dark h3 {
  color: var(--white);
}

.resource-page .resource-section--dark .eyebrow,
.resource-page .resource-section--dark h2 span {
  color: var(--gold-light);
}

.resource-heading {
  max-width: 760px;
  margin-bottom: 42px;
}

.resource-heading h2 {
  margin: 0 0 16px;
  font-size: clamp(36px, 5vw, 58px);
  line-height: 1.05;
}

.resource-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 18px;
}

.resource-section--dark .resource-heading p {
  color: rgba(255, 255, 255, 0.68);
}

.resource-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.resource-card {
  display: flex;
  min-height: 300px;
  flex-direction: column;
  padding: 34px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--white);
  box-shadow: 0 14px 34px rgba(20, 20, 20, 0.06);
}

.resource-card__label {
  margin-bottom: 18px;
  color: #7a5a20;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.resource-card h2,
.resource-card h3 {
  margin: 0 0 14px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 30px;
  line-height: 1.12;
  letter-spacing: -0.6px;
}

.resource-card p {
  margin: 0 0 22px;
  color: var(--muted);
}

.resource-card .text-link {
  margin-top: auto;
}

.text-link {
  color: #6f511b;
  font-weight: 800;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.text-link:hover,
.text-link:focus-visible {
  color: var(--black);
}

.official-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.official-link {
  display: flex;
  min-height: 220px;
  flex-direction: column;
  padding: 26px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.055);
  text-decoration: none;
}

.official-link:hover,
.official-link:focus-visible {
  border-color: var(--gold);
  transform: translateY(-2px);
}

.official-link small {
  color: var(--gold-light);
  font-weight: 800;
  letter-spacing: 0.9px;
  text-transform: uppercase;
}

.official-link strong {
  margin: 13px 0 10px;
  color: var(--white);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 25px;
  line-height: 1.13;
}

.official-link span {
  color: rgba(255, 255, 255, 0.68);
}

.resource-cta {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 32px;
  padding: 46px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--white);
  box-shadow: var(--shadow);
}

.resource-cta h2 {
  margin: 0 0 12px;
  font-size: clamp(32px, 4vw, 48px);
  line-height: 1.05;
}

.resource-cta p {
  max-width: 700px;
  margin: 0;
  color: var(--muted);
}

.resource-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  max-width: 100%;
  min-height: 50px;
  padding: 13px 22px;
  border-radius: 10px;
  background: var(--black);
  color: var(--white) !important;
  font-weight: 800;
  text-align: center;
  text-decoration: none;
  white-space: normal;
}

.resource-button:hover,
.resource-button:focus-visible {
  background: var(--gold);
  color: #fff !important;
}

.article-hero {
  padding: 78px 0 64px;
  border-bottom: 1px solid var(--border);
}

.breadcrumbs {
  margin-bottom: 28px;
  color: #76591f;
  font-size: 14px;
  font-weight: 750;
}

.breadcrumbs a {
  text-decoration: none;
}

.article-hero h1 {
  max-width: 940px;
  font-size: clamp(44px, 6vw, 76px);
}

.article-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  margin-top: 26px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 650;
}

.article-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  align-items: start;
  gap: 70px;
  padding: 72px 0 96px;
}

.article-body {
  max-width: 760px;
  font-size: 17px;
}

.article-body h2 {
  margin: 54px 0 18px;
  font-size: clamp(32px, 4vw, 46px);
  line-height: 1.08;
}

.article-body h3 {
  margin: 34px 0 12px;
  font-size: 23px;
  line-height: 1.2;
}

.article-body p,
.article-body ul,
.article-body ol {
  margin: 0 0 20px;
}

.article-body li + li {
  margin-top: 10px;
}

.article-body a {
  color: #70521b;
  font-weight: 750;
  text-underline-offset: 3px;
}

.article-aside {
  position: sticky;
  top: 102px;
  padding: 26px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--white);
  box-shadow: 0 12px 30px rgba(20, 20, 20, 0.05);
}

.article-aside strong {
  display: block;
  margin-bottom: 12px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
}

.article-aside p {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 14px;
}

.article-aside a {
  display: block;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  color: #684a15;
  font-size: 14px;
  font-weight: 750;
  text-decoration: none;
}

.article-aside a:last-child {
  border-bottom: 0;
}

.article-callout {
  margin: 34px 0;
  padding: 24px 26px;
  border-left: 4px solid var(--gold);
  border-radius: 0 14px 14px 0;
  background: var(--cream-dark);
}

.article-callout strong {
  display: block;
  margin-bottom: 8px;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin: 30px 0;
}

.week-card {
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--white);
}

.week-card strong {
  display: block;
  margin-bottom: 8px;
  color: #6e511c;
}

.article-disclaimer {
  margin-top: 52px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 14px;
}

.resource-page footer {
  padding: 34px 0;
  background: #080808;
  color: rgba(255, 255, 255, 0.62);
  font-size: 14px;
}

.resource-page .footer-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.resource-page .footer-brand {
  color: var(--white);
  font-weight: 800;
}

.resource-page .footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
}

.resource-page .footer-links a {
  color: rgba(255, 255, 255, 0.72);
  text-decoration: none;
}

@media (max-width: 1080px) {
  .resource-page .nav-links {
    gap: 15px;
  }

  .resource-page .nav-links a {
    font-size: 13px;
  }
}

@media (max-width: 1080px) {
  .teaching-proof,
  .image-split,
  .image-split--reverse,
  .article-layout {
    grid-template-columns: 1fr;
  }

  .article-aside {
    position: static;
    order: -1;
  }

  .resource-page .menu-button {
    display: inline-flex;
  }

  .resource-page .nav-links {
    position: absolute;
    top: 76px;
    right: 20px;
    left: 20px;
    display: none;
    max-height: calc(100vh - 90px);
    max-height: calc(100dvh - 90px);
    overflow-y: auto;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--white);
    box-shadow: var(--shadow);
  }

  .resource-page .nav-links.open {
    display: flex;
  }

  .resource-page .nav-links a {
    flex-shrink: 0;
    padding: 11px 12px;
  }

  .resource-page .nav-contact {
    margin-top: 6px;
    text-align: center;
  }

  .official-grid {
    grid-template-columns: 1fr;
  }
}

@media (min-width: 981px) and (max-width: 1160px) {
  body:not(.resource-page) .nav-links {
    gap: 10px;
  }

  body:not(.resource-page) .nav-links a {
    font-size: 12px;
  }

  body:not(.resource-page) .nav-contact {
    padding-right: 12px;
    padding-left: 12px;
  }
}

@media (max-width: 760px) {
  body:not(.resource-page) .nav-links.open {
    max-height: calc(100vh - 82px);
    max-height: calc(100dvh - 82px);
    gap: 2px;
    overflow-y: auto;
  }

  body:not(.resource-page) .nav-links.open a {
    flex-shrink: 0;
  }
}

@media (max-width: 720px) {
  .teaching-proof__content,
  .resource-card,
  .resource-cta {
    padding: 26px;
  }

  .resource-grid,
  .week-grid {
    grid-template-columns: 1fr;
  }

  .resource-cta {
    grid-template-columns: 1fr;
  }

  .resource-section {
    padding: 68px 0;
  }

  .resource-page .footer-content {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (prefers-reduced-motion: reduce) {
  .resource-page html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition-duration: 0.01ms !important;
  }
}


.profile-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin: 24px 0 0;
  padding: 0;
  list-style: none;
  font-size: 14px;
}

.profile-links a {
  color: #72531c;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* Privacy, policies and cookie controls */

.cookie-settings-link {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.footer-links .cookie-settings-link {
  color: rgba(255, 255, 255, 0.72);
  text-decoration: none;
}

.footer-links .cookie-settings-link:hover,
.footer-links .cookie-settings-link:focus-visible {
  color: #ffffff;
  text-decoration: underline;
}

  position: fixed;
  right: 22px;
  bottom: 22px;
  left: 22px;
  z-index: 5000;
  display: flex;
  width: min(760px, calc(100% - 44px));
  margin-left: auto;
  padding: 22px;
  border: 1px solid rgba(234, 217, 182, 0.28);
  border-radius: 18px;
  background: #111111;
  color: #ffffff;
  box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);

.cookie-banner__copy {
  flex: 1;
}

.cookie-banner__copy strong {
  display: block;
  margin-bottom: 5px;
  font-size: 17px;
}

.cookie-banner__copy p {
  margin: 0;
  color: rgba(255, 255, 255, 0.75);
  font-size: 14px;
  line-height: 1.55;
}

.cookie-banner__copy a {
  color: #ead9b6;
}

.cookie-banner__actions {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  margin-left: 20px;
}

.cookie-button {
  padding: 10px 14px;

  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.cookie-button--primary,
.cookie-button--secondary {
  background: #ead9b6;
  color: #111111;
}

.cookie-button:hover,
.cookie-button:focus-visible {
  background: #ffffff;
  border-color: #ffffff;
}

.practice-problem {
  margin: 30px 0;
  padding: 22px;
  border: 1px solid rgba(17, 17, 17, 0.14);
  border-radius: 14px;
  background: #ffffff;
}

.practice-problem h2 {
  margin-top: 0;
}

.practice-problem details {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(17, 17, 17, 0.12);
}

.practice-problem summary {
  font-weight: 800;
  cursor: pointer;
}

.practice-problem details p:last-child {
  margin-bottom: 0;
}

.form-honeypot {
  position: absolute !important;
  left: -10000px !important;
  width: 1px !important;
  height: 1px !important;
  overflow: hidden !important;
}

.form-note a {
  color: #72531c;
  font-weight: 750;
}

.policy-hero {
  padding: 92px 0 72px;
  background: #111111;
  color: #ffffff;
}

.policy-hero__inner {
  max-width: 820px;
}

.policy-hero h1 {
  max-width: 760px;
  margin: 0 0 18px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(44px, 7vw, 76px);
  line-height: 1.04;
  letter-spacing: -2px;
}

.policy-hero p {
  max-width: 700px;
  color: rgba(255, 255, 255, 0.74);
  font-size: 18px;
}

.policy-hero .policy-updated {
  margin-top: 28px;
  color: #ead9b6;
  font-size: 14px;
}

.policy-section {
  padding: 84px 0 100px;
}

.policy-layout {

.policy-content {

}

.policy-content h2 {
  margin: 46px 0 13px;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 28px;
  line-height: 1.2;
}

.policy-content h2:first-child {
  margin-top: 0;
}

.policy-content p,

ref=\"/amc10-past-papers.html\" aria-label=\"AMC 10 paper archive\">AMC 10<\/a><a href=\"/amc12-past-papers.html\" aria-label=\"AMC 12 paper archive\">AMC 12<\/a><a href=\"/aime-past-papers.html\" aria-label=\"AIME paper archive\">AIME<\/a><a href=\"/bmo-past-papers.html\" aria-label=\"BMO paper archive\">BMO<\/a><\/div>\n    <\/div>\n  <\/nav>\n  <!-- /Shared past-paper navigation --><main id=\"main-content\"><header class=\"textbook-hero\"><div class=\"container\"><nav class=\"textbook-breadcrumbs\" aria-label=\"Breadcrumb\"><a href=\"resources.html\">All resources<\/a><\/nav><p class=\"topic-kicker\">UK Edexcel · A-level &amp; Further Maths<\/p><h1>Your textbook.<br>Practice with a purpose.<\/h1><p>Chapter-by-chapter worked-solution links, original practice checks and guidance for the next step. Choose the book you use in lessons.<\/p><nav class=\"topic-jumps\" aria-label=\"Companion shortcuts\"><a href=\"#books\">Choose your book<\/a><a href=\"#using-the-companions\">Plan a practice session<\/a><a href=\"maths-topic-practice.html\">Topic guides<\/a><\/nav><\/div><\/header><div class=\"container\"><section id=\"books\" class=\"textbook-grid\" aria-label=\"Edexcel textbook companions\"><article class=\"book-card\"><div class=\"book-card-top\"><span>Pure mathematics<\/span><h2><a href=\"edexcel-pure-year-1.html\">Pure Year 1<\/a><\/h2><\/div><div class=\"book-card-body\"><p>Build reliable algebra, graphs, trigonometry and introductory calculus.<\/p><a class=\"resource-button\" href=\"edexcel-pure-year-1.html\">Open the companion<span class=\"sr-only\"> for Pure Year 1<\/span><\/a><\/div><\/article><article class=\"book-card\"><div class=\"book-card-top\"><span>Pure mathematics<\/span><h2><a href=\"edexcel-pure-year-2.html\">Pure Year 2<\/a><\/h2><\/div><div class=\"book-card-body\"><p>Connect functions, sequences and calculus, then choose methods in mixed problems.<\/p><a class=\"resource-button\" href=\"edexcel-pure-year-2.html\">Open the companion<span class=\"sr-only\"> for Pure Year 2<\/span><\/a><\/div><\/article><article class=\"book-card\"><div class=\"book-card-top\"><span>Applied mathematics<\/span><h2><a href=\"edexcel-statistics-mechanics-year-1.html\">Statistics &amp; Mechanics Year 1<\/a><\/h2><\/div><div class=\"book-card-body\"><p>Choose statistical models, interpret data and translate motion into equations.<\/p><a class=\"resource-button\" href=\"edexcel-statistics-mechanics-year-1.html\">Open the companion<span class=\"sr-only\"> for Statistics &amp; Mechanics Year 1<\/span><\/a><\/div><\/article><article class=\"book-card\"><div class=\"book-card-top\"><span>Applied mathematics<\/span><h2><a href=\"edexcel-statistics-mechanics-year-2.html\">Statistics &amp; Mechanics Year 2<\/a><\/h2><\/div><div class=\"book-card-body\"><p>Develop conditional probability, normal distributions, forces and kinematics.<\/p><a class=\"resource-button\" href=\"edexcel-statistics-mechanics-year-2.html\">Open the companion<span class=\"sr-only\"> for Statistics &amp; Mechanics Year 2<\/span><\/a><\/div><\/article><article class=\"book-card\"><div class=\"book-card-top\"><span>Further mathematics<\/span><h2><a href=\"edexcel-core-pure-1.html\">Core Pure 1<\/a><\/h2><\/div><div class=\"book-card-body\"><p>Build fluency with complex numbers, matrices, vectors and mathematical proof.<\/p><a class=\"resource-button\" href=\"edexcel-core-pure-1.html\">Open the companion<span class=\"sr-only\"> for Core Pure 1<\/span><\/a><\/div><\/article><article class=\"book-card\"><div class=\"book-card-top\"><span>Further mathematics<\/span><h2><a href=\"edexcel-core-pure-2.html\">Core Pure 2<\/a><\/h2><\/div><div class=\"book-card-body\"><p>Develop complex-number methods, polar coordinates and differential equations.<\/p><a class=\"resource-button\" href=\"edexcel-core-pure-2.html\">Open the companion<span class=\"sr-only\"> for Core Pure 2<\/span><\/a><\/div><\/article><\/section>\n<section class=\"textbook-section\" id=\"using-the-companions\"><h2>Turn a chapter into a practice session<\/h2><ol><li><strong>Choose one skill.<\/strong> Use a question you could not finish to identify the chapter you need.<\/li><li><strong>Work from your textbook.<\/strong> Attempt a small selection from the relevant exercise before opening its solutions.<\/li><li><strong>Review the first wrong step.<\/strong> Explain the correction, then retry the question from a clean page.<\/li><li><strong>Mix the methods.<\/strong> Return to the chapter’s mixed exercise once the individual techniques feel secure.<\/li><\/ol><div class=\"textbook-note\"><p><strong>For lessons and homework:<\/strong> each companion has a short original practice check, a find-the-mistake example and a printable sheet with full solutions. Chapter links can be shared directly.<\/p><\/div><\/section>\n<section class=\"textbook-section\"><h2>From textbook techniques to unfamiliar problems<\/h2><p>Use the topic guides to strengthen algebra, graph sketches, calculus and reasoning. When you are ready, return to the admissions archives for longer or less familiar problems, choosing topics that fit your test’s current specification.<\/p><nav class=\"topic-jumps\" aria-label=\"Further practice\"><a href=\"maths-topic-practice.html\">Worked topic guides<\/a><a href=\"tmua-paper-archive.html\">TMUA practice<\/a><a href=\"step-past-papers.html\">STEP practice<\/a><a href=\"esat-paper-archive.html\">ESAT &amp; physics practice<\/a><\/nav><\/section><p class=\"textbook-credit\">Textbooks and linked SolutionBank materials: Pearson Education, accessed through <a href=\"https://www.physicsandmathstutor.com/maths-revision/solutionbanks/\">Physics &amp; Maths Tutor’s Edexcel SolutionBank<\/a>. Original practice questions, hints and explanations on this page: Arij Asad. This is an independent companion to the UK Edexcel 2017 series; match the chapter and exercise labels to your book. International A-level and older modular books use different numbering.<\/p><aside class=\"topic-tuition\"><div><h2>Specialist tuition and guided practice<\/h2><p>Individual online lessons, tailored problem sheets and structured practice between lessons, focused on the areas you need to strengthen.<\/p><\/div><a class=\"resource-button\" href=\"contact.html#enquiry-form\">Discuss your tuition package<\/a><\/aside><\/div><\/main>  <footer><div class=\"container footer-content\"><div><div class=\"footer-brand\">Arij Asad Maths<\/div><div>Specialist online mathematics tuition<\/div><\/div><div class=\"footer-links\"><a href=\"tuition.html\">Tuition<\/a><a href=\"resources.html\">Resources<\/a><a href=\"about.html\">About<\/a><a href=\"contact.html\">Contact<\/a><a href=\"privacy.html\">Privacy<\/a><a href=\"terms.html\">Terms<\/a><button class=\"cookie-settings-link\" type=\"button\" data-cookie-settings>Cookie settings<\/button><\/div><div>© 2026 Arij Asad Maths<\/div><\/div><\/footer>"},"edexcel-pure-year-1.html":{"label":"Pure Year 1","bodyClass":"resource-page topic-page textbook-page","html":"<a class=\"skip-link\" href=\"#main-content\">Skip to main content<\/a>  <header class=\"site-header\">\n    <div class=\"container nav\">\n      <a class=\"brand\" href=\"/\">Arij Asad <span>Maths<\/span><\/a>\n      <button class=\"menu-button\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu<\/button>\n      <nav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Main navigation\">\n        <a href=\"/\">Home<\/a><a href=\"about.html\">About<\/a><a href=\"tuition.html\">Tuition<\/a>\n        <a href=\"tmua.html\">TMUA<\/a><a href=\"step.html\">STEP<\/a><a href=\"interviews.html\">Interviews<\/a>\n        <a href=\"maths-challenges.html\">Challenges<\/a>\n        <a href=\"university-maths.html\">University<\/a>\n        <a href=\"resources.html\">Resources<\/a><a href=\"zh.html\">中文<\/a>\n        <a class=\"nav-contact\" href=\"contact.html\">Contact<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n  <!-- Shared past-paper navigation -->\n  <nav class=\"paper-archive-bar\" aria-label=\"Past paper archives\">\n    <div class=\"paper-archive-bar__inner\">\n      <span class=\"paper-archive-bar__label\">Past paper archives<\/span>\n      <div class=\"paper-archive-bar__links\"><a href=\"/tmua-paper-archive.html\" aria-label=\"TMUA paper archive\">TMUA<\/a><a href=\"/mat-past-papers.html\" aria-label=\"MAT paper archive\">MAT<\/a><a href=\"/step-past-papers.html\" aria-label=\"STEP paper archive\">STEP<\/a><a href=\"/esat-paper-archive.html\" aria-label=\"ESAT paper archive\">ESAT<\/a><a href=\"/jmc-past-papers.html\" aria-label=\"JMC paper archive\">JMC<\/a><a href=\"/imc-past-papers.html\" aria-label=\"IMC paper archive\">IMC<\/a><a href=\"/smc-past-papers.html\" aria-label=\"SMC paper archive\">SMC<\/a><a href=\"/amc10-past-papers.html\" aria-label=\"AMC 10 paper archive\">AMC 10<\/a><a href=\"/amc12-past-papers.html\" aria-label=\"AMC 12 paper archive\">AMC 12<\/a><a href=\"/aime-past-papers.html\" aria-label=\"AIME paper archive\">AIME<\/a><a href=\"/bmo-past-papers.html\" aria-label=\"BMO paper archive\">BMO<\/a><\/div>\n    <\/div>\n  <\/nav>\n  <!-- /Shared past-paper navigation --><main id=\"main-content\"><header class=\"textbook-hero\"><div class=\"container\"><nav class=\"textbook-breadcrumbs\" aria-label=\"Breadcrumb\"><a href=\"resources.html\">Resources<\/a><span>/<\/span><a href=\"edexcel-textbook-companions.html\">Edexcel companions<\/a><\/nav><p class=\"topic-kicker\">Pure mathematics · UK A-level<\/p><h1>Edexcel Pure Year 1<\/h1><p>Build reliable algebra, graphs, trigonometry and introductory calculus. Find your chapter, open the matching worked solutions, and try a short practice check.<\/p><nav class=\"topic-jumps\" aria-label=\"Page sections\"><a href=\"#chapters\">Chapters &amp; solutions<\/a><a href=\"#practice\">Try the practice check<\/a><a href=\"#downloads\">Download the sheet<\/a><\/nav><\/div><\/header>\n<div class=\"container\"><nav class=\"book-switcher\" aria-label=\"T <span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch1/Exercise%201B.pdf\" class=\"exercise\" aria-label=\"Exercise 1B worked solutions (PDF)\">Exercise 1B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch1/Exercise%201C.pdf\" class=\"exercise\" aria-label=\"Exercise 1C worked solutions (PDF)\">Exercise 1C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch1/Exercise%201D.pdf\" class=\"exercise\" aria-label=\"Exercise 1D worked solutions (PDF)\">Exercise 1D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch1/Exercise%201E.pdf\" class=\"exercise\" aria-label=\"Exercise 1E worked solutions (PDF)\">Exercise 1E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch1/Exercise%201F.pdf\" class=\"exercise\" aria-label=\"Exercise 1F worked solutions (PDF)\">Exercise 1F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch1/Mixed%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 1 worked solutions (PDF)\">Mixed Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"algebra-and-factorisation.html\">Algebra and factorisation<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-2\"><summary>2. Quadratics<\/summary><div class=\"chapter-content\"><p>Practise spotting a useful structure before expanding.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202A.pdf\" class=\"exercise\" aria-label=\"Exercise 2A worked solutions (PDF)\">Exercise 2A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202B.pdf\" class=\"exercise\" aria-label=\"Exercise 2B worked solutions (PDF)\">Exercise 2B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202C.pdf\" class=\"exercise\" aria-label=\"Exercise 2C worked solutions (PDF)\">Exercise 2C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202D.pdf\" class=\"exercise\" aria-label=\"Exercise 2D worked solutions (PDF)\">Exercise 2D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202E.pdf\" class=\"exercise\" aria-label=\"Exercise 2E worked solutions (PDF)\">Exercise 2E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202F.pdf\" class=\"exercise\" aria-label=\"Exercise 2F worked solutions (PDF)\">Exercise 2F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202G.pdf\" class=\"exercise\" aria-label=\"Exercise 2G worked solutions (PDF)\">Exercise 2G<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Exercise%202H.pdf\" class=\"exercise\" aria-label=\"Exercise 2H worked solutions (PDF)\">Exercise 2H<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch2/Mixed%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 2 worked solutions (PDF)\">Mixed Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"algebra-and-factorisation.html\">Algebra and factorisation<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-3\"><summary>3. Equations and Inequalities<\/summary><div class=\"chapter-content\"><p>Check the meaning of the quantities before choosing a calculation.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch3/Exercise%203A.pdf\" class=\"exercise\" aria-label=\"Exercise 3A worked solutions (PDF)\">Exercise 3A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch3/Exercise%203B.pdf\" class=\"exercise\" aria-label=\"Exercise 3B worked solutions (PDF)\">Exercise 3B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch3/Exercise%203C.pdf\" class=\"exercise\" aria-label=\"Exercise 3C worked solutions (PDF)\">Exercise 3C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch3/Exercise%203D.pdf\" class=\"exercise\" aria-label=\"Exercise 3D worked solutions (PDF)\">Exercise 3D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch3/Exercise%203E.pdf\" class=\"exercise\" aria-label=\"Exercise 3E worked solutions (PDF)\">Exercise 3E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a h class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch13/Exercise%2013F.pdf\" class=\"exercise\" aria-label=\"Exercise 13F worked solutions (PDF)\">Exercise 13F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch13/Exercise%2013G.pdf\" class=\"exercise\" aria-label=\"Exercise 13G worked solutions (PDF)\">Exercise 13G<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch13/Mixed%20Exercise%2013.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 13 worked solutions (PDF)\">Mixed Exercise 13<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"calculus-and-graph-sketches.html\">Calculus and graph sketches<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-14\"><summary>14. Exponentials and Logarithms<\/summary><div class=\"chapter-content\"><p>Check the meaning of the quantities before choosing a calculation.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014A.pdf\" class=\"exercise\" aria-label=\"Exercise 14A worked solutions (PDF)\">Exercise 14A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014B.pdf\" class=\"exercise\" aria-label=\"Exercise 14B worked solutions (PDF)\">Exercise 14B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014C.pdf\" class=\"exercise\" aria-label=\"Exercise 14C worked solutions (PDF)\">Exercise 14C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014D.pdf\" class=\"exercise\" aria-label=\"Exercise 14D worked solutions (PDF)\">Exercise 14D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014E.pdf\" class=\"exercise\" aria-label=\"Exercise 14E worked solutions (PDF)\">Exercise 14E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014F.pdf\" class=\"exercise\" aria-label=\"Exercise 14F worked solutions (PDF)\">Exercise 14F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014G.pdf\" class=\"exercise\" aria-label=\"Exercise 14G worked solutions (PDF)\">Exercise 14G<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Exercise%2014H.pdf\" class=\"exercise\" aria-label=\"Exercise 14H worked solutions (PDF)\">Exercise 14H<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Ch14/Mixed%20Exercise%2014.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 14 worked solutions (PDF)\">Mixed Exercise 14<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/div><\/details><section id=\"review-solutions\" class=\"textbook-section\"><h2>Review &amp; practice-paper solutions<\/h2><h3>Review Exercises: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Rev/Review%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Review Exercise 1 worked solutions (PDF)\">Review Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Rev/Review%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Review Exercise 2 worked solutions (PDF)\">Review Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Rev/Review%20Exercise%203.pdf\" class=\"mixed\" aria-label=\"Review Exercise 3 worked solutions (PDF)\">Review Exercise 3<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><h3>Practice Exam Paper: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P1/Prac/Practice%20Exam%20Paper.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper worked solutions (PDF)\">Practice Exam Paper<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/section><\/div><\/div><p class=\"textbook-credit\">Textbooks and linked SolutionBank materials: Pearson Education, accessed through <a href=\"https://www.physicsandmathstutor.com/maths-revision/solutionbanks/edexcel-pure-maths-year-1/\">Physics &amp; Maths Tutor’s Edexcel SolutionBank<\/a>. Original practice questions, hints and explanations on this page: Arij Asad. This is an independent companion to the UK Edexcel 2017 series; match the chapter and exercise labels to your book. International A-level and older modular books use different numbering.<\/p><\/section>\n<section class=\"textbook-section\" id=\"practice\"><p class=\"topic-kicker\">Original practice by Arij Asad<\/p><h2>A short practice check<\/h2><p>Try these three questions before opening the hints. They sample a few useful skills; use them to choose what to revisit, rather than as a complete assessment of the book.<\/p><article class=\"practice-card\" id=\"question-1\"><div class=\"practice-head\"><h3>1. Quadratic inequalities<\/h3><p>Solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><mo>≤<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x^2-5x+6\\leq 0<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Factorise, then decide where the upward-opening quadratic is on or below the horizontal axis.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>Factorising gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>5<\/mn><mi>x<\/mi><mo>+<\/mo><mn>6<\/mn><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">x^2-5x+6=(x-2)(x-3)<\/annotation><\/semantics><\/math><\/span>, so the roots are <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">3<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The coefficient of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">x^2<\/annotation><\/semantics><\/math><\/span> is positive, so the graph is below the axis between the roots. Equality is allowed, so both endpoints are included.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>≤<\/mo><mi>x<\/mi><mo>≤<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2\\leq x\\leq 3<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-2\"><div class=\"practice-head\"><h3>2. Stationary points<\/h3><p>For <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><msup><mi>x<\/mi><mn>3<\/mn><\/msup><mo>−<\/mo><mn>6<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>9<\/mn><mi>x<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f(x)=x^3-6x^2+9x+1<\/annotation><\/semantics><\/math><\/span>, find the coordinates of both stationary points and classify each one.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f<\/mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′<\/mo><\/msup><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f^{\\prime}(x)=0<\/annotation><\/semantics><\/math><\/span>, substitute back into <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><\/mrow><annotation encoding=\"application/x-tex\">f<\/annotation><\/semantics><\/math><\/span>, then use the sign of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f<\/mi><mrow><mo mathvariant=\"normal\">′<\/mo><mo mathvariant=\"normal\">′<\/mo><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">f^{\\prime\\prime}<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f<\/mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′<\/mo><\/msup><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>3<\/mn><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>12<\/mn><mi>x<\/mi><mo>+<\/mo><mn>9<\/mn><mo>=<\/mo><mn>3<\/mn><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">f^{\\prime}(x)=3x^2-12x+9=3(x-1)(x-3)<\/annotation><\/semantics><\/math><\/span>, so the stationary points occur at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=1<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=3<\/annotation><\/semantics><\/math><\/span>.<\/p><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f(1)=5<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f<\/mi><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f(3)=1<\/annotation><\/semantics><\/math><\/span>, giving the points <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo separator=\"true\">,<\/mo><mn>5<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(1,5)<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><mo separator=\"true\">,<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(3,1)<\/annotation><\/semantics><\/math><\/span>.<\/p><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f<\/mi><mrow><mo mathvariant=\"normal\">′<\/mo><mo mathvariant=\"normal\">′<\/mo><\/mrow><\/msup><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>6<\/mn><mi>x<\/mi><mo>−<\/mo><mn>12<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f^{\\prime\\prime}(x)=6x-12<\/annotation><\/semantics><\/math><\/span>. Since <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f<\/mi><mrow><mo mathvariant=\"normal\">′<\/mo><mo mathvariant=\"normal\">′<\/mo><\/mrow><\/msup><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><mn>6<\/mn><mo>&lt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f^{\\prime\\prime}(1)=-6&lt;0<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo separator=\"true\">,<\/mo><mn>5<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(1,5)<\/annotation><\/semantics><\/math><\/span> is a local maximum. Since <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f<\/mi><mrow><mo mathvariant=\"normal\">′<\/mo><mo mathvariant=\"normal\">′<\/mo><\/mrow><\/msup><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>6<\/mn><mo>&gt;<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">f^{\\prime\\prime}(3)=6&gt;0<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><mo separator=\"true\">,<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(3,1)<\/annotation><\/semantics><\/math><\/span> is a local minimum.<\/p><p><strong>Answer:<\/strong> Local maximum <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo separator=\"true\">,<\/mo><mn>5<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(1,5)<\/annotation><\/semantics><\/math><\/span>; local minimum <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><mo separator=\"true\">,<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(3,1)<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-3\"><div class=\"practice-head\"><h3>3. Definite integration<\/h3><p>Evaluate <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><msubsup><mo>∫<\/mo><mn>1<\/mn><mn>3<\/mn><\/msubsup><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><\/mstyle><\/mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\int_1^3(2x+1)\\,\\mathrm{d}x<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Find an antiderivative and subtract its value at the lower limit from its value at the upper limit.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>An antiderivative of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2x+1<\/annotation><\/semantics><\/math><\/span> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x^2+x<\/annotation><\/semantics><\/math><\/span>.<\/p><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msubsup><mo>∫<\/mo><mn>1<\/mn><mn>3<\/mn><\/msubsup><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><mo>=<\/mo><mo stretchy=\"false\">[<\/mo><msup><mi>x<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mi>x<\/mi><msubsup><mo stretchy=\"false\">]<\/mo><mn>1<\/mn><mn>3<\/mn><\/msubsup><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>9<\/mn><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>10.<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\int_1^3(2x+1)\\,\\mathrm{d}x=[x^2+x]_1^3=(9+3)-(1+1)=10.<\/annotation><\/semantics><\/math><\/span><\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>10<\/mn><\/mrow><annotation encoding=\"application/x-tex\">10<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"find-the-mistake\"><div class=\"practice-head\"><h3>Find the mistake<\/h3><p>A student writes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">)<\/mo><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>=<\/mo><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sqrt{(x-2)^2}=x-2<\/annotation><\/semantics><\/math><\/span> for every real <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math><\/span>. Explain the error and give a statement that is always correct.<\/p><\/div><div class=\"practice-body\"><details><summary>Show the correction<\/summary><div><p>At <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=0<\/annotation><\/semantics><\/math><\/span>, the left side is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>4<\/mn><\/msqrt><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sqrt{4}=2<\/annotation><\/semantics><\/math><\/span>, whereas the claimed right side is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">-2<\/annotation><\/semantics><\/math><\/span>. Squaring removes a sign, so taking the non-negative square root does not always recover the original expression.<\/p><p>The correct identity is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">)<\/mo><mn>2<\/mn><\/msup><\/mrow><\/msqrt><mo>=<\/mo><mi mathvariant=\"normal\">∣<\/mi><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><mi mathvariant=\"normal\">∣<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\sqrt{(x-2)^2}=|x-2|<\/annotation><\/semantics><\/math><\/span>. This equals <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>−<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x-2<\/annotation><\/semantics><\/math><\/span> when <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>≥<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x\\geq 2<\/annotation><\/semantics><\/math><\/span>, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>−<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">2-x<\/annotation><\/semantics><\/math><\/span> when <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>&lt;<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x&lt;2<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><aside class=\"textbook-note\"><h3>Use what you found<\/h3><ol><li>Pair quadratic factorisation with a quick sketch, then practise choosing intervals for both strict and inclusive inequalities.<\/li><li>For stationary-point questions, finish the full chain: derivative, roots, coordinates and classification.<\/li><li>After practising one method, try a mixed exercise without looking at its chapter heading. Explain how you chose the method.<\/li><\/ol><\/aside><\/section>\n<section class=\"textbook-section\" id=\"downloads\"><h2>Take the practice into a lesson<\/h2><p>The printable sheet contains the questions first, followed by hints and full worked solutions. The editable LaTeX source is ready for Overleaf.<\/p><div class=\"download-row\"><a href=\"assets/textbook-practice/pure-year-1-practice.pdf\">Practice sheet &amp; solutions (PDF)<\/a><a href=\"assets/textbook-practice/edexcel-practice-overleaf.zip\" download>All six sheets for Overleaf (ZIP)<\/a><\/div><\/section><aside class=\"topic-tuition\"><div><h2>Specialist tuition and guided practice<\/h2><p>Individual online lessons, tailored rked solutions (PDF)\">Exercise 1B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch1/Exercise%201C.pdf\" class=\"exercise\" aria-label=\"Exercise 1C worked solutions (PDF)\">Exercise 1C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch1/Exercise%201D.pdf\" class=\"exercise\" aria-label=\"Exercise 1D worked solutions (PDF)\">Exercise 1D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch1/Exercise%201E.pdf\" class=\"exercise\" aria-label=\"Exercise 1E worked solutions (PDF)\">Exercise 1E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch1/Exercise%201F.pdf\" class=\"exercise\" aria-label=\"Exercise 1F worked solutions (PDF)\">Exercise 1F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch1/Exercise%201G.pdf\" class=\"exercise\" aria-label=\"Exercise 1G worked solutions (PDF)\">Exercise 1G<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch1/Mixed%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 1 worked solutions (PDF)\">Mixed Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"algebra-and-factorisation.html\">Algebra and factorisation<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-2\"><summary>2. Functions and Graphs<\/summary><div class=\"chapter-content\"><p>Use a sketch to check the effect of transformations and domain restrictions.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Exercise%202A.pdf\" class=\"exercise\" aria-label=\"Exercise 2A worked solutions (PDF)\">Exercise 2A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Exercise%202B.pdf\" class=\"exercise\" aria-label=\"Exercise 2B worked solutions (PDF)\">Exercise 2B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Exercise%202C.pdf\" class=\"exercise\" aria-label=\"Exercise 2C worked solutions (PDF)\">Exercise 2C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Exercise%202D.pdf\" class=\"exercise\" aria-label=\"Exercise 2D worked solutions (PDF)\">Exercise 2D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Exercise%202E.pdf\" class=\"exercise\" aria-label=\"Exercise 2E worked solutions (PDF)\">Exercise 2E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Exercise%202F.pdf\" class=\"exercise\" aria-label=\"Exercise 2F worked solutions (PDF)\">Exercise 2F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Exercise%202G.pdf\" class=\"exercise\" aria-label=\"Exercise 2G worked solutions (PDF)\">Exercise 2G<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Ch2/Mixed%20Exercise%202.pdf\" class=\"mixed\" a
