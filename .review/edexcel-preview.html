ercise 2 worked solutions (PDF)\">Review Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><h3>Practice Exam Paper: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Prac/Practice%20Exam%20Paper%201.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper 1 worked solutions (PDF)\">Practice Exam Paper 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/P2/Prac/Practice%20Exam%20Paper%202.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper 2 worked solutions (PDF)\">Practice Exam Paper 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/section><\/div><\/div><p class=\"textbook-credit\">Textbooks and linked SolutionBank materials: Pearson Education, accessed through <a href=\"https://www.physicsandmathstutor.com/maths-revision/solutionbanks/edexcel-pure-maths-year-2/\">Physics &amp; Maths Tutor’s Edexcel SolutionBank<\/a>. Original practice questions, hints and explanations on this page: Arij Asad. This is an independent companion to the UK Edexcel 2017 series; match the chapter and exercise labels to your book. International A-level and older modular books use different numbering.<\/p><\/section>\n<section class=\"textbook-section\" id=\"practice\"><p class=\"topic-kicker\">Original practice by Arij Asad<\/p><h2>A short practice check<\/h2><p>Try these three questions before opening the hints. They sample a few useful skills; use them to choose what to revisit, rather than as a complete assessment of the book.<\/p><article class=\"practice-card\" id=\"question-1\"><div class=\"practice-head\"><h3>1. Trigonometric equations<\/h3><p>Solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><msup><mrow><mi>sin<\/mi><mo>⁡<\/mo><\/mrow><mn>2<\/mn><\/msup><mi>x<\/mi><mo>+<\/mo><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2\\sin^2x+\\sin x-1=0<\/annotation><\/semantics><\/math><\/span> for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>≤<\/mo><mi>x<\/mi><mo>&lt;<\/mo><mn>2<\/mn><mi>π<\/mi><\/mrow><annotation encoding=\"application/x-tex\">0\\leq x&lt;2\\pi<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Treat <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\sin x<\/annotation><\/semantics><\/math><\/span> as the variable while factorising, then find every angle in the stated interval.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><msup><mrow><mi>sin<\/mi><mo>⁡<\/mo><\/mrow><mn>2<\/mn><\/msup><mi>x<\/mi><mo>+<\/mo><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1<\/mn><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">2\\sin^2x+\\sin x-1=(2\\sin x-1)(\\sin x+1)<\/annotation><\/semantics><\/math><\/span>. Hence <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">\\sin x=\\tfrac12<\/annotation><\/semantics><\/math><\/span> or <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sin x=-1<\/annotation><\/semantics><\/math><\/span>.<\/p><p>In the given interval, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">\\sin x=\\tfrac12<\/annotation><\/semantics><\/math><\/span> gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mfrac><mi>π<\/mi><mn>6<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">x=\\tfrac\\pi6<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mfrac><mrow><mn>5<\/mn><mi>π<\/mi><\/mrow><mn>6<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">x=\\tfrac{5\\pi}6<\/annotation><\/semantics><\/math><\/span>. The equation <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin<\/mi><mo>⁡<\/mo><mi>x<\/mi><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sin x=-1<\/annotation><\/semantics><\/math><\/span> gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mfrac><mrow><mn>3<\/mn><mi>π<\/mi><\/mrow><mn>2<\/mn><\/mfrac><\/mrow><annotation encoding=\"application/x-tex\">x=\\tfrac{3\\pi}2<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>π<\/mi><mn>6<\/mn><\/mfrac><\/mstyle><mo separator=\"true\">,<\/mo><mtext> <\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>5<\/mn><mi>π<\/mi><\/mrow><mn>6<\/mn><\/mfrac><\/mstyle><mo separator=\"true\">,<\/mo><mtext> <\/mtext><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>3<\/mn><mi>π<\/mi><\/mrow><mn>2<\/mn><\/mfrac><\/mstyle><\/mrow><annotation encoding=\"application/x-tex\">x=\\dfrac\\pi6,\\ \\dfrac{5\\pi}6,\\ \\dfrac{3\\pi}2<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-2\"><div class=\"practice-head\"><h3>2. Parametric differentiation<\/h3><p>A curve is given by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>+<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=t^2+1<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><msup><mi>t<\/mi><mn>3<\/mn><\/msup><mo>−<\/mo><mn>3<\/mn><mi>t<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y=t^3-3t<\/annotation><\/semantics><\/math><\/span>. Find the equation of its tangent at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">t=2<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Use <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d<\/mi><mi>y<\/mi><mi mathvariant=\"normal\">/<\/mi><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi mathvariant=\"normal\">d<\/mi><mi>y<\/mi><mi mathvariant=\"normal\">/<\/mi><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mi mathvariant=\"normal\">/<\/mi><mo stretchy=\"false\">(<\/mo><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><mi mathvariant=\"normal\">/<\/mi><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{d}y/\\mathrm{d}x=(\\mathrm{d}y/\\mathrm{d}t)/(\\mathrm{d}x/\\mathrm{d}t)<\/annotation><\/semantics><\/math><\/span>, and find the point as well as the gradient.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>At <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">t=2<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=5<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y=2<\/annotation><\/semantics><\/math><\/span>, so the required point is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>5<\/mn><mo separator=\"true\">,<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(5,2)<\/annotation><\/semantics><\/math><\/span>.<\/p><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><mi mathvariant=\"normal\">/<\/mi><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><mo>=<\/mo><mn>2<\/mn><mi>t<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{d}x/\\mathrm{d}t=2t<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d<\/mi><mi>y<\/mi><mi mathvariant=\"normal\">/<\/mi><mi mathvariant=\"normal\">d<\/mi><mi>t<\/mi><mo>=<\/mo><mn>3<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{d}y/\\mathrm{d}t=3t^2-3<\/annotation><\/semantics><\/math><\/span>. Thus <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d<\/mi><mi>y<\/mi><mi mathvariant=\"normal\">/<\/mi><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mi mathvariant=\"normal\">/<\/mi><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{d}y/\\mathrm{d}x=(3t^2-3)/(2t)<\/annotation><\/semantics><\/math><\/span>, which is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">9/4<\/annotation><\/semantics><\/math><\/span> at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">t=2<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The tangent through <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>5<\/mn><mo separator=\"true\">,<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(5,2)<\/annotation><\/semantics><\/math><\/span> with gradient <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">9/4<\/annotation><\/semantics><\/math><\/span> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>5<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">y-2=\\tfrac94(x-5)<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>9<\/mn><mn>4<\/mn><\/mfrac><\/mstyle><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>−<\/mo><mn>5<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">y-2=\\dfrac94(x-5)<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-3\"><div class=\"practice-head\"><h3>3. Integration by parts<\/h3><p>Evaluate <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><msubsup><mo>∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><\/mstyle><\/mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\int_0^1 xe^x\\,\\mathrm{d}x<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>In integration by parts, differentiate <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math><\/span> and integrate <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">e^x<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>Take <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mo>=<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">u=x<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d<\/mi><mi>v<\/mi><mo>=<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{d}v=e^x\\,\\mathrm{d}x<\/annotation><\/semantics><\/math><\/span>, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">d<\/mi><mi>u<\/mi><mo>=<\/mo><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\mathrm{d}u=\\mathrm{d}x<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v<\/mi><mo>=<\/mo><msup><mi>e<\/mi><mi>x<\/mi><\/msup><\/mrow><annotation encoding=\"application/x-tex\">v=e^x<\/annotation><\/semantics><\/math><\/span>.<\/p><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mtable rowspacing=\"0.25em\" columnalign=\"right left\" columnspacing=\"0em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><msubsup><mo>∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><mo stretchy=\"false\">[<\/mo><mi>x<\/mi><msup><mi>e<\/mi><mi>x<\/mi><\/msup><msubsup><mo stretchy=\"false\">]<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><mo>−<\/mo><msubsup><mo>∫<\/mo><mn>0<\/mn><mn>1<\/mn><\/msubsup><msup><mi>e<\/mi><mi>x<\/mi><\/msup><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><mi>e<\/mi><mo>−<\/mo><mo stretchy=\"false\">(<\/mo><mi>e<\/mi><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1.<\/mn><\/mrow><\/mstyle><\/mtd><\/mtr><\/mtable><annotation encoding=\"application/x-tex\">\\begin{aligned}\\int_0^1 xe^x\\,\\mathrm{d}x&amp;=[xe^x]_0^1-\\int_0^1e^x\\,\\mathrm{d}x\\\\&amp;=e-(e-1)=1.\\end{aligned}<\/annotation><\/semantics><\/math><\/span><\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"find-the-mistake\"><div class=\"practice-head\"><h3>Find the mistake<\/h3><p>A student calculates <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mo>∫<\/mo><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><mn>1<\/mn><\/msubsup><mi>x<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\int_{-1}^1x\\,\\mathrm{d}x=0<\/annotation><\/semantics><\/math><\/span> and concludes that the total area between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">y=x<\/annotation><\/semantics><\/math><\/span> and the horizontal axis on this interval is zero. Correct the conclusion.<\/p><\/div><div class=\"practice-body\"><details><summary>Show the correction<\/summary><div><p>The integral is correctly calculated as zero: the contribution below the axis is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−<\/mo><mn>1<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">-1/2<\/annotation><\/semantics><\/math><\/span> and the contribution above the axis is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1/2<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Total area adds their magnitudes. Equivalently, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mo>∫<\/mo><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><mn>1<\/mn><\/msubsup><mi mathvariant=\"normal\">∣<\/mi><mi>x<\/mi><mi mathvariant=\"normal\">∣<\/mi><mtext> <\/mtext><mi mathvariant=\"normal\">d<\/mi><mi>x<\/mi><mo>=<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\int_{-1}^1|x|\\,\\mathrm{d}x=\\tfrac12+\\tfrac12=1<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><aside class=\"textbook-note\"><h3>Use what you found<\/h3><ol><li>Keep the interval and angle units visible when solving trigonometric equations; use a sketch to check for missing roots.<\/li><li>Before integrating, decide whether simplification, substitution or integration by parts makes the structure easier.<\/li><li>Use graph sketches to check signs, turning points and cancellation before committing to lengthy algebra.<\/li><\/ol><\/aside><\/section>\n<section class=\"textbook-section\" id=\"downloads\"><h2>Take the practice into a lesson<\/h2><p>The printable sheet contains the questions first, followed by hints and full worked solutions. The editable LaTeX source is ready for Overleaf.<\/p><div class=\"download-row\"><a href=\"assets/textbook-practice/pure-year-2-practice.pdf\">Practice sheet &amp; solutions (PDF)<\/a><a href=\"assets/textbook-practice/edexcel-practice-overleaf.zip\" download>All six sheets for Overleaf (ZIP)<\/a><\/div><\/section><aside class=\"topic-tuition\"><div><h2>Specialist tuition and guided practice<\/h2><p>Individual online lessons, tailored problem sheets and structured practice between lessons, focused on the areas you need to strengthen.<\/p><\/div><a class=\"resource-button\" href=\"contact.html#enquiry-form\">Discuss your tuition package<\/a><\/aside><\/div><\/main>  <footer><div class=\"container footer-content\"><div><div class=\"footer-brand\">Arij Asad Maths<\/div><div>Specialist online mathematics tuition<\/div><\/div><div class=\"footer-links\"><a href=\"tuition.html\">Tuition<\/a><a href=\"resources.html\">Resources<\/a><a href=\"about.html\">About<\/a><a href=\"contact.html\">Contact<\/a><a href=\"privacy.html\">Privacy<\/a><a href=\"terms.html\">Terms<\/a><button class=\"cookie-settings-link\" type=\"button\" data-cookie-settings>Cookie settings<\/button><\/div><div>© 2026 Arij Asad Maths<\/div><\/div><\/footer>"},"edexcel-statistics-mechanics-year-1.html":{"label":"Statistics & Mechanics Year 1","bodyClass":"resource-page topic-page textbook-page","html":"<a class=\"skip-link\" href=\"#main-content\">Skip to main content<\/a>  <header class=\"site-header\">\n    <div class=\"container nav\">\n      <a class=\"brand\" href=\"/\">Arij Asad <span>Maths<\/span><\/a>\n      <button class=\"menu-button\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu<\/button>\n      <nav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Main navigation\">\n        <a href=\"/\">Home<\/a><a href=\"about.html\">About<\/a><a href=\"tuition.html\">Tuition<\/a>\n        <a href=\"tmua.html\">TMUA<\/a><a href=\"step.html\">STEP<\/a><a href=\"interviews.html\">Interviews<\/a>\n        <a href=\"maths-challenges.html\">Challenges<\/a>\n        <a href=\"university-maths.html\">University<\/a>\n        <a href=\"resources.html\">Resources<\/a><a href=\"zh.html\">中文<\/a>\n        <a class=\"nav-contact\" href=\"contact.html\">Contact<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n  <!-- Shared past-paper navigation -->\n  <nav class=\"paper-archive-bar\" aria-label=\"Past paper archives\">\n    <div class=\"paper-archive-bar__inner\">\n      <span class=\"paper-archive-bar__label\">Past paper archives<\/span>\n      <div class=\"paper-archive-bar__links\"><a href=\"/tmua-paper-archive.html\" aria-label=\"TMUA paper archive\">TMUA<\/a><a href=\"/mat-past-papers.html\" aria-label=\"MAT paper archive\">MAT<\/a><a href=\"/step-past-papers.html\" aria-label=\"STEP paper archive\">STEP<\/a><a href=\"/esat-paper-archive.html\" aria-label=\"ESAT paper archive\">ESAT<\/a><a href=\"/jmc-past-papers.html\" aria-label=\"JMC paper archive\">JMC<\/a><a href=\"/imc-past-papers.html\" aria-label=\"IMC paper archive\">IMC<\/a><a href=\"/smc-past-papers.html\" aria-label=\"SMC paper archive\">SMC<\/a><a href=\"/amc10-past-papers.html\" aria-label=\"AMC 10 paper archive\">AMC 10<\/a><a href=\"/amc12-past-papers.html\" aria-label=\"AMC 12 paper archive\">AMC 12<\/a><a href=\"/aime-past-papers.html\" aria-label=\"AIME paper archive\">AIME<\/a><a href=\"/bmo-past-papers.html\" aria-label=\"BMO paper archive\">BMO<\/a><\/div>\n    <\/div>\n  <\/nav>\n  <!-- /Shared past-paper navigation --><main id=\"main-content\"><header class=\"textbook-hero\"><div class=\"container\"><nav class=\"textbook-breadcrumbs\" aria-label=\"Breadcrumb\"><a href=\"resources.html\">Resources<\/a><span>/<\/span><a href=\"edexcel-textbook-companions.html\">Edexcel companions<\/a><\/nav><p class=\"topic-kicker\">Applied mathematics · UK A-level<\/p><h1>Edexcel Statistics &amp; Mechanics Year 1<\/h1><p>Choose statistical models, interpret data and translate motion into equations. Find your chapter, open the matching worked solutions, and try a short practice check.<\/p><nav class=\"topic-jumps\" aria-label=\"Page sections\"><a href=\"#chapters\">Chapters &amp; solutions<\/a><a href=\"#practice\">Try the practice check<\/a><a href=\"#downloads\">Download the sheet<\/a><\/nav><\/div><\/header>\n<div class=\"container\"><nav class=\"book-switcher\" aria-label=\"Textbook companions\"><a href=\"edexcel-pure-year-1.html\">Pure Year 1<\/a><a href=\"edexcel-pure-year-2.html\">Pure Year 2<\/a><a href=\"edexcel-statistics-mechanics-year-1.html\" aria-current=\"page\">Statistics &amp; Mechanics Year 1<\/a><a href=\"edexcel-statistics-mechanics-year-2.html\">Statistics &amp; Mechanics Year 2<\/a><a href=\"edexcel-core-pure-1.html\">Core Pure 1<\/a><a href=\"edexcel-core-pure-2.html\">Core Pure 2<\/a><\/nav><section class=\"textbook-section\" id=\"chapters\"><h2>Chapters &amp; worked solutions<\/h2><p>Use your textbook for the questions. Every exercise button below opens the corresponding SolutionBank PDF.<\/p><div class=\"chapter-layout\"><aside class=\"chapter-menu\"><h3>Jump to a chapter<\/h3><nav aria-label=\"Chapters\"><a href=\"#chapter-1\">1. Data Collection<\/a><a href=\"#chapter-2\">2. Measures of Location and Spread<\/a><a href=\"#chapter-3\">3. Representations of Data<\/a><a href=\"#chapter-4\">4. Correlation<\/a><a href=\"#chapter-5\">5. Probability<\/a><a href=\"#chapter-6\">6. Statistical Distributions<\/a><a href=\"#chapter-7\">7. Hypothesis Testing<\/a><a href=\"#chapter-8\">8. Modelling in Mechanics<\/a><a href=\"#chapter-9\">9. Constant Acceleration<\/a><a href=\"#chapter-10\">10. Forces and Motion<\/a><a href=\"#chapter-11\">11. Variable Acceleration<\/a><a href=\"#review-solutions\">Review &amp; practice papers<\/a><\/nav><\/aside><div class=\"chapter-list\"><details class=\"chapter\" id=\"chapter-1\" open><summary>1. Data Collection<\/summary><div class=\"chapter-content\"><p>Identify the population, sampling frame and sampling method. Explain a possible source of bias in the context of the question.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch1/Exercise%201A.pdf\" class=\"exercise\" aria-label=\"Exercise 1A worked solutions (PDF)\">Exercise 1A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch1/Exercise%201B.pdf\" class=\"exercise\" aria-label=\"Exercise 1B worked solutions (PDF)\">Exercise 1B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch1/Exercise%201C.pdf\" class=\"exercise\" aria-label=\"Exercise 1C worked solutions (PDF)\">Exercise 1C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch1/Exercise%201D.pdf\" class=\"exercise\" aria-label=\"Exercise 1D worked solutions (PDF)\">Exercise 1D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch1/Exercise%201E.pdf\" class=\"exercise\" aria-label=\"Exercise 1E worked solutions (PDF)\">Exercise 1E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch1/Mixed%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 1 worked solutions (PDF)\">Mixed Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/div><\/details><details class=\"chapter\" id=\"chapter-2\"><summary>2. Measures of Location and Spread<\/summary><div class=\"chapter-content\"><p>Distinguish a change in the centre from a change in the spread. Predict the effect of coding before calculating.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch2/Exercise%202A.pdf\" class=\"exercise\" aria-label=\"Exercise 2A worked solutions (PDF)\">Exercise 2A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch2/Exercise%202B.pdf\" class=\"exercise\" aria-label=\"Exercise 2B worked solutions (PDF)\">Exercise 2B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch2/Exercise%202C.pdf\" class=\"exercise\" aria-label=\"Exercise 2C worked solutions (PDF)\">Exercise 2C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch2/Exercise%202D.pdf\" class=\"exercise\" aria-label=\"Exercise 2D worked solutions (PDF)\">Exercise 2D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch2/Exercise%202E.pdf\" class=\"exercise\" aria-label=\"Exercise 2E worked solutions (PDF)\">Exercise 2E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch2/Exercise%202F.pdf\" class=\"exercise\" aria-label=\"Exercise 2F worked solutions (PDF)\">Exercise 2F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch2/Mixed%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 2 worked solutions (PDF)\">Mixed Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"#question-2\">Coding and spread practice check<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-3\"><summary>3. Representations of Data<\/summary><div class=\"chapter-content\"><p>Read axes and units before comparing diagrams. For a histogram, use frequency density and remember that area represents frequency.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch3/Exercise%203A.pdf\" class=\"exercise\" aria-label=\"Exercise 3A worked solutions (PDF)\">Exercise 3A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch3/Exercise%203B.pdf\" class=\"exercise\" aria-label=\"Exercise 3B worked solutions (PDF)\">Exercise 3B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch3/Exercise%203C.pdf\" class=\"exercise\" aria-label=\"Exercise 3C worked solutions (PDF)\">Exercise 3C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch3/Exercise%203D.pdf\" class=\"exercise\" aria-label=\"Exercise 3D worked solutions (PDF)\">Exercise 3D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch3/Exercise%203E.pdf\" class=\"exercise\" aria-label=\"Exercise 3E worked solutions (PDF)\">Exercise 3E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch3/Mixed%20Exercise%203.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 3 worked solutions (PDF)\">Mixed Exercise 3<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/div><\/details><details class=\"chapter\" id=\"chapter-4\"><summary>4. Correlation<\/summary><div class=\"chapter-content\"><p>Define the population parameter and state hypotheses clearly. Give the conclusion in context, keeping correlation separate from causation.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch4/Exercise%204A.pdf\" class=\"exercise\" aria-label=\"Exercise 4A worked solutions (PDF)\">Exercise 4A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch4/Exercise%204B.pdf\" class=\"exercise\" aria-label=\"Exercise 4B worked solutions (PDF)\">Exercise 4B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch4/Mixed%20Exercise%204.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 4 worked solutions (PDF)\">Mixed Exercise 4<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/div><\/details><details class=\"chapter\" id=\"chapter-5\"><summary>5. Probability<\/summary><div class=\"chapter-content\"><p>Write events carefully and check whether cases overlap.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch5/Exercise%205A.pdf\" class=\"exercise\" aria-label=\"Exercise 5A worked solutions (PDF)\">Exercise 5A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch5/Exercise%205B.pdf\" class=\"exercise\" aria-label=\"Exercise 5B worked solutions (PDF)\">Exercise 5B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch5/Exercise%205C.pdf\" class=\"exercise\" aria-label=\"Exercise 5C worked solutions (PDF)\">Exercise 5C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch5/Exercise%205D.pdf\" class=\"exercise\" aria-label=\"Exercise 5D worked solutions (PDF)\">Exercise 5D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch5/Mixed%20Exercise%205.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 5 worked solutions (PDF)\">Mixed Exercise 5<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"counting-and-overlap.html\">Counting and overlap<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-6\"><summary>6. Statistical Distributions<\/summary><div class=\"chapter-content\"><p>State the random variable and check that the model fits: fixed trial count, independence and constant success probability.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch6/Exercise%206A.pdf\" class=\"exercise\" aria-label=\"Exercise 6A worked solutions (PDF)\">Exercise 6A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch6/Exercise%206B.pdf\" class=\"exercise\" aria-label=\"Exercise 6B worked solutions (PDF)\">Exercise 6B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch6/Exercise%206C.pdf\" class=\"exercise\" aria-label=\"Exercise 6C worked solutions (PDF)\">Exercise 6C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch6/Mixed%20Exercise%206.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 6 worked solutions (PDF)\">Mixed Exercise 6<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"#question-1\">Binomial-probability practice check<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-7\"><summary>7. Hypothesis Testing<\/summary><div class=\"chapter-content\"><p>Define the population parameter and state hypotheses clearly. Give the conclusion in context, keeping correlation separate from causation.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch7/Exercise%207A.pdf\" class=\"exercise\" aria-label=\"Exercise 7A worked solutions (PDF)\">Exercise 7A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch7/Exercise%207B.pdf\" class=\"exercise\" aria-label=\"Exercise 7B worked solutions (PDF)\">Exercise 7B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch7/Exercise%207C.pdf\" class=\"exercise\" aria-label=\"Exercise 7C worked solutions (PDF)\">Exercise 7C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch7/Exercise%207D.pdf\" class=\"exercise\" aria-label=\"Exercise 7D worked solutions (PDF)\">Exercise 7D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch7/Mixed%20Exercise%207.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 7 worked solutions (PDF)\">Mixed Exercise 7<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/div><\/details><details class=\"chapter\" id=\"chapter-8\"><summary>8. Modelling in Mechanics<\/summary><div class=\"chapter-content\"><p>Extend modelling skills with clearly labelled historical physics and engineering questions.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch8/Exercise%208A.pdf\" class=\"exercise\" aria-label=\"Exercise 8A worked solutions (PDF)\">Exercise 8A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Ed se\" aria-label=\"Exercise 10C worked solutions (PDF)\">Exercise 10C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch10/Exercise%2010D.pdf\" class=\"exercise\" aria-label=\"Exercise 10D worked solutions (PDF)\">Exercise 10D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch10/Exercise%2010E.pdf\" class=\"exercise\" aria-label=\"Exercise 10E worked solutions (PDF)\">Exercise 10E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch10/Exercise%2010F.pdf\" class=\"exercise\" aria-label=\"Exercise 10F worked solutions (PDF)\">Exercise 10F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch10/Mixed%20Exercise%2010.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 10 worked solutions (PDF)\">Mixed Exercise 10<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"esat-paper-archive.html\">ESAT and physics practice<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-11\"><summary>11. Variable Acceleration<\/summary><div class=\"chapter-content\"><p>Extend modelling skills with clearly labelled historical physics and engineering questions.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch11/Exercise%2011A.pdf\" class=\"exercise\" aria-label=\"Exercise 11A worked solutions (PDF)\">Exercise 11A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch11/Exercise%2011B.pdf\" class=\"exercise\" aria-label=\"Exercise 11B worked solutions (PDF)\">Exercise 11B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch11/Exercise%2011C.pdf\" class=\"exercise\" aria-label=\"Exercise 11C worked solutions (PDF)\">Exercise 11C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch11/Exercise%2011D.pdf\" class=\"exercise\" aria-label=\"Exercise 11D worked solutions (PDF)\">Exercise 11D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch11/Exercise%2011E.pdf\" class=\"exercise\" aria-label=\"Exercise 11E worked solutions (PDF)\">Exercise 11E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Ch11/Mixed%20Exercise%2011.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 11 worked solutions (PDF)\">Mixed Exercise 11<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"esat-paper-archive.html\">ESAT and physics practice<\/a>.<\/p><\/div><\/details><section id=\"review-solutions\" class=\"textbook-section\"><h2>Review &amp; practice-paper solutions<\/h2><h3>Review Exercises: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Rev/Review%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Review Exercise 2 worked solutions (PDF)\">Review Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><h3>Practice Exam Paper: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM1/Prac/Practice%20Exam%20Paper.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper worked solutions (PDF)\">Practice Exam Paper<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/section><\/div><\/div><p class=\"textbook-credit\">Textbooks and linked SolutionBank materials: Pearson Education, accessed through <a href=\"https://www.physicsandmathstutor.com/maths-revision/solutionbanks/edexcel-statistics-mechanics-year-1/\">Physics &amp; Maths Tutor’s Edexcel SolutionBank<\/a>. Original practice questions, hints and explanations on this page: Arij Asad. This is an independent companion to the UK Edexcel 2017 series; match the chapter and exercise labels to your book. International A-level and older modular books use different numbering.<\/p><\/section>\n<section class=\"textbook-section\" id=\"practice\"><p class=\"topic-kicker\">Original practice by Arij Asad<\/p><h2>A short practice check<\/h2><p>Try these three questions before opening the hints. They sample a few useful skills; use them to choose what to revisit, rather than as a complete assessment of the book.<\/p><article class=\"practice-card\" id=\"question-1\"><div class=\"practice-head\"><h3>1. Binomial probability<\/h3><p>A biased coin has probability <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1/3<\/annotation><\/semantics><\/math><\/span> of landing heads on each toss. Four tosses are independent. Find the probability of at least one head.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>The complement of at least one head is no heads.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>The probability of a tail on one toss is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2/3<\/annotation><\/semantics><\/math><\/span>. Independence means that the probability of four tails is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><msup><mo stretchy=\"false\">)<\/mo><mn>4<\/mn><\/msup><mo>=<\/mo><mn>16<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>81<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(2/3)^4=16/81<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Therefore <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mtext>at least one head<\/mtext><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mn>16<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>81<\/mn><mo>=<\/mo><mn>65<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>81<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(\\text{at least one head})=1-16/81=65/81<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>65<\/mn><mn>81<\/mn><\/mfrac><\/mstyle><\/mrow><annotation encoding=\"application/x-tex\">\\dfrac{65}{81}<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-2\"><div class=\"practice-head\"><h3>2. Coding and measures of spread<\/h3><p>A data set has mean <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><\/mrow><annotation encoding=\"application/x-tex\">12<\/annotation><\/semantics><\/math><\/span> and standard deviation <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">3<\/annotation><\/semantics><\/math><\/span>. Every value <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><\/mrow><annotation encoding=\"application/x-tex\">x<\/annotation><\/semantics><\/math><\/span> is replaced by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>2<\/mn><mi>x<\/mi><mo>−<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y=2x-5<\/annotation><\/semantics><\/math><\/span>. Find the mean and standard deviation of the new data set.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>A translation changes the centre but not the spread; multiplying every value scales the spread.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>The mean transforms in the same way as each value: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>y<\/mi><mo>ˉ<\/mo><\/mover><mo>=<\/mo><mn>2<\/mn><mover accent=\"true\"><mi>x<\/mi><mo>ˉ<\/mo><\/mover><mo>−<\/mo><mn>5<\/mn><mo>=<\/mo><mn>2<\/mn><mo stretchy=\"false\">(<\/mo><mn>12<\/mn><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mn>5<\/mn><mo>=<\/mo><mn>19<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\bar y=2\\bar x-5=2(12)-5=19<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Subtracting <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">5<\/annotation><\/semantics><\/math><\/span> does not change deviations from the mean. Multiplication by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2<\/annotation><\/semantics><\/math><\/span> doubles their sizes, so the standard deviation is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>6<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2(3)=6<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> Mean <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>19<\/mn><\/mrow><annotation encoding=\"application/x-tex\">19<\/annotation><\/semantics><\/math><\/span>; standard deviation <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><\/mrow><annotation encoding=\"application/x-tex\">6<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-3\"><div class=\"practice-head\"><h3>3. Newton&#x27;s second law and constant acceleration<\/h3><p>A particle of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">k<\/mi><mi mathvariant=\"normal\">g<\/mi><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">3\\,\\mathrm{kg}<\/annotation><\/semantics><\/math><\/span> starts from rest on a smooth horizontal surface. A constant horizontal force of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">12\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span> acts on it. Find its displacement after <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">s<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4\\,\\mathrm{s}<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Find the acceleration from the horizontal resultant force, then use a constant-acceleration equation.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>The surface is smooth, so there is no friction. Vertically, weight and the normal reaction balance. Horizontally, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F<\/mi><mo>=<\/mo><mi>m<\/mi><mi>a<\/mi><\/mrow><annotation encoding=\"application/x-tex\">F=ma<\/annotation><\/semantics><\/math><\/span> gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>12<\/mn><mo>=<\/mo><mn>3<\/mn><mi>a<\/mi><\/mrow><annotation encoding=\"application/x-tex\">12=3a<\/annotation><\/semantics><\/math><\/span>, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>=<\/mo><mn>4<\/mn><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">m<\/mi><mtext> <\/mtext><msup><mi mathvariant=\"normal\">s<\/mi><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">a=4\\,\\mathrm{m\\,s^{-2}}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>With <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">u=0<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">t=4<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>s<\/mi><mo>=<\/mo><mi>u<\/mi><mi>t<\/mi><mo>+<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mi>a<\/mi><msup><mi>t<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mn>0<\/mn><mo>+<\/mo><mfrac><mn>1<\/mn><mn>2<\/mn><\/mfrac><mo stretchy=\"false\">(<\/mo><mn>4<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><msup><mn>4<\/mn><mn>2<\/mn><\/msup><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>32<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">s=ut+\\tfrac12at^2=0+\\tfrac12(4)(4^2)=32\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>32<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">32\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span> in the direction of the force.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"find-the-mistake\"><div class=\"practice-head\"><h3>Find the mistake<\/h3><p>A particle has velocity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mn>6<\/mn><mo>−<\/mo><mn>2<\/mn><mi>t<\/mi><mo stretchy=\"false\">)<\/mo><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">m<\/mi><mtext> <\/mtext><msup><mi mathvariant=\"normal\">s<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">v=(6-2t)\\,\\mathrm{m\\,s^{-1}}<\/annotation><\/semantics><\/math><\/span> for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><mo>≤<\/mo><mi>t<\/mi><mo>≤<\/mo><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0\\leq t\\leq5<\/annotation><\/semantics><\/math><\/span>, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><\/mrow><annotation encoding=\"application/x-tex\">t<\/annotation><\/semantics><\/math><\/span> in seconds. A student finds a displacement of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">5\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span> and calls this the distance travelled. Find the actual distance.<\/p><\/div><div class=\"practice-body\"><details><summary>Show the correction<\/summary><div><p>The particle changes direction when <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6<\/mn><mo>−<\/mo><mn>2<\/mn><mi>t<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">6-2t=0<\/annotation><\/semantics><\/math><\/span>, at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">t=3<\/annotation><\/semantics><\/math><\/span>. Its displacement over the whole interval is indeed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[<\/mo><mn>6<\/mn><mi>t<\/mi><mo>−<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><msubsup><mo stretchy=\"false\">]<\/mo><mn>0<\/mn><mn>5<\/mn><\/msubsup><mo>=<\/mo><mn>5<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">[6t-t^2]_0^5=5\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>From <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">0<\/annotation><\/semantics><\/math><\/span> to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">3<\/annotation><\/semantics><\/math><\/span> seconds it travels <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[<\/mo><mn>6<\/mn><mi>t<\/mi><mo>−<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><msubsup><mo stretchy=\"false\">]<\/mo><mn>0<\/mn><mn>3<\/mn><\/msubsup><mo>=<\/mo><mn>9<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">[6t-t^2]_0^3=9\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>. From <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">3<\/annotation><\/semantics><\/math><\/span> to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">5<\/annotation><\/semantics><\/math><\/span> seconds its displacement is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">[<\/mo><mn>6<\/mn><mi>t<\/mi><mo>−<\/mo><msup><mi>t<\/mi><mn>2<\/mn><\/msup><msubsup><mo stretchy=\"false\">]<\/mo><mn>3<\/mn><mn>5<\/mn><\/msubsup><mo>=<\/mo><mo>−<\/mo><mn>4<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">[6t-t^2]_3^5=-4\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>, so it travels a further <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Total distance is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9<\/mn><mo>+<\/mo><mn>4<\/mn><mo>=<\/mo><mn>13<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">9+4=13\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><aside class=\"textbook-note\"><h3>Use what you found<\/h3><ol><li>Write down the random variable and modelling assumptions before calculating a binomial probability.<\/li><li>Predict how the mean and spread should change under coding before using a calculator.<\/li><li>For mechanics, start with a force diagram, a positive direction and a list of known quantities; check units at the end.<\/li><\/ol><\/aside><\/section>\n<section class=\"textbook-section\" id=\"downloads\"><h2>Take the practice into a lesson<\/h2><p>The printable sheet contains the questions first, followed by hints and full worked solutions. The editable LaTeX source is ready for Overleaf.<\/p><div class=\"download-row\"><a href=\"assets/textbook-practice/statistics-mechanics-year-1-practice.pdf\">Practice sheet &amp; solutions (PDF)<\/a><a href=\"assets/textbook-practice/edexcel-practice-overleaf.zip\" download>All six sheets for Overleaf (ZIP)<\/a><\/div><\/section><aside class=\"topic-tuition\"><div><h2>Specialist tuition and guided practice<\/h2><p>Individual online lessons, tailored problem sheets and structured practice between lessons, focused on the areas you need to strengthen.<\/p><\/div><a class=\"resource-button\" href=\"contact.html#enquiry-form\">Discuss your tuition package<\/a><\/aside><\/div><\/main>  <footer><div class=\"container footer-content\"><div><div class=\"footer-brand\">Arij Asad Maths<\/div><div>Specialist online mathematics tuition<\/div><\/div><div class=\"footer-links\"><a href=\"tuition.html\">Tuition<\/a><a href=\"resources.html\">Resources<\/a><a href=\"about.html\">About<\/a><a href=\"contact.html\">Contact<\/a><a href=\"privacy.html\">Privacy<\/a><a href=\"terms.html\">Terms<\/a><button class=\"cookie-settings-link\" type=\"button\" data-cookie-settings>Cookie settings<\/button><\/div><div>© 2026 Arij Asad Maths<\/div><\/div><\/footer>"},"edexcel-statistics-mechanics-year-2.html":{"label":"Statistics & Mechanics Year 2","bodyClass":"resource-page topic-page textbook-page","html":"<a class=\"skip-link\" href=\"#main-content\">Skip to main content<\/a>  <header class=\"site-header\">\n    <div class=\"container nav\">\n      <a class=\"brand\" href=\"/\">Arij Asad <span>Maths<\/span><\/a>\n      <button class=\"menu-button\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu<\/button>\n      <nav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Main navigation\">\n        <a href=\"/\">Home<\/a><a href=\"about.html\">About<\/a><a href=\"tuition.html\">Tuition<\/a>\n        <a href=\"tmua.html\">TMUA<\/a><a href=\"step.html\">STEP<\/a><a href=\"interviews.html\">Interviews<\/a>\n        <a href=\"maths-challenges.html\">Challenges<\/a>\n        <a href=\"university-maths.html\">University<\/a>\n        <a href=\"resources.html\">Resources<\/a><a href=\"zh.html\">中文<\/a>\n        <a class=\"nav-contact\" href=\"contact.html\">Contact<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n  <!-- Shared past-paper navigation -->\n  <nav class=\"paper-archive-bar\" aria-label=\"Past paper archives\">\n    <div class=\"paper-archive-bar__inner\">\n      <span class=\"paper-archive-bar__label\">Past paper archives<\/span>\n      <div class=\"paper-archive-bar__links\"><a href=\"/tmua-paper-archive.html\" aria-label=\"TMUA paper archive\">TMUA<\/a><a href=\"/mat-past-papers.html\" aria-label=\"MAT paper archive\">MAT<\/a><a href=\"/step-past-papers.html\" aria-label=\"STEP paper archive\">STEP<\/a><a href=\"/esat-paper-archive.html\" aria-label=\"ESAT paper archive\">ESAT<\/a><a href=\"/jmc-past-papers.html\" aria-label=\"JMC paper archive\">JMC<\/a><a href=\"/imc-past-papers.html\" aria-label=\"IMC paper archive\">IMC<\/a><a href=\"/smc-past-papers.html\" aria-label=\"SMC paper archive\">SMC<\/a><a href=\"/amc10-past-papers.html\" aria-label=\"AMC 10 paper archive\">AMC 10<\/a><a href=\"/amc12-past-papers.html\" aria-label=\"AMC 12 paper archive\">AMC 12<\/a><a href=\"/aime-past-papers.html\" aria-label=\"AIME paper archive\">AIME<\/a><a href=\"/bmo-past-papers.html\" aria-label=\"BMO paper archive\">BMO<\/a><\/div>\n    <\/div>\n  <\/nav>\n  <!-- /Shared past-paper navigation --><main id=\"main-content\"><header class=\"textbook-hero\"><div class=\"container\"><nav class=\"textbook-breadcrumbs\" aria-label=\"Breadcrumb\"><a href=\"resources.html\">Resources<\/a><span>/<\/span><a href=\"edexcel-textbook-companions.html\">Edexcel companions<\/a><\/nav><p class=\"topic-kicker\">Applied mathematics · UK A-level<\/p><h1>Edexcel Statistics &amp; Mechanics Year 2<\/h1><p>Develop conditional probability, normal distributions, forces and kinematics. Find your chapter, open the matching worked solutions, and try a short practice check.<\/p><nav class=\"topic-jumps\" aria-label=\"Page sections\"><a href=\"#chapters\">Chapters &amp; solutions<\/a><a href=\"#practice\">Try the practice check<\/a><a href=\"#downloads\">Download the sheet<\/a><\/nav><\/div><\/header>\n<div class=\"container\"><nav class=\"book-switcher\" aria-label=\"Textbook companions\"><a href=\"edexcel-pure-year-1.html\">Pure Year 1<\/a><a href=\"edexcel-pure-year-2.html\">Pure Year 2<\/a><a href=\"edexcel-statistics-mechanics-year-1.html\">Statistics &amp; Mechanics Year 1<\/a><a href=\"edexcel-statistics-mechanics-year-2.html\" aria-current=\"page\">Statistics &amp; Mechanics Year 2<\/a><a href=\"edexcel-core-pure-1.html\">Core Pure 1<\/a><a href=\"edexcel-core-pure-2.html\">Core Pure 2<\/a><\/nav><section class=\"textbook-section\" id=\"chapters\"><h2>Chapters &amp; worked solutions<\/h2><p>Use your textbook for the questions. Every exercise button below opens the corresponding SolutionBank PDF.<\/p><div class=\"chapter-layout\"><aside class=\"chapter-menu\"><h3>Jump to a chapter<\/h3><nav aria-label=\"Chapters\"><a href=\"#chapter-1\">1. Regression, Correlation and Hypothesis Testing<\/a><a href=\"#chapter-2\">2. Conditional Probability<\/a><a href=\"#chapter-3\">3. The Normal Distribution<\/a><a href=\"#chapter-4\">4. Moments<\/a><a href=\"#chapter-5\">5. Forces and Friction<\/a><a href=\"#chapter-6\">6. Projectiles<\/a><a href=\"#chapter-7\">7. Applications of Forces<\/a><a href=\"#chapter-8\">8. Further Kinematics<\/a><a href=\"#review-solutions\">Review &amp; practice papers<\/a><\/nav><\/aside><div class=\"chapter-list\"><details class=\"chapter\" id=\"chapter-1\" open><summary>1. Regression, Correlation and Hypothesis Testing<\/summary><div class=\"chapter-content\"><p>Define the population parameter and state hypotheses clearly. Give the conclusion in context, keeping correlation separate from causation.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch1/Exercise%201A.pdf\" class=\"exercise\" aria-label=\"Exercise 1A worked solutions (PDF)\">Exercise 1A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch1/Exercise%201B.pdf\" class=\"exercise\" aria-label=\"Exercise 1B worked solutions (PDF)\">Exercise 1B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch1/Exercise%201C.pdf\" class=\"exercise\" aria-label=\"Exercise 1C worked solutions (PDF)\">Exercise 1C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch1/Mixed%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 1 worked solutions (PDF)\">Mixed Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/div><\/details><details class=\"chapter\" id=\"chapter-2\"><summary>2. Conditional Probability<\/summary><div class=\"chapter-content\"><p>Write events carefully and check whether cases overlap.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch2/Exercise%202A.pdf\" class=\"exercise\" aria-label=\"Exercise 2A worked solutions (PDF)\">Exercise 2A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch2/Exercise%202B.pdf\" class=\"exercise\" aria-label=\"Exercise 2B worked solutions (PDF)\">Exercise 2B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch2/Exercise%202C.pdf\" class=\"exercise\" aria-label=\"Exercise 2C worked solutions (PDF)\">Exercise 2C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch2/Exercise%202D.pdf\" class=\"exercise\" aria-label=\"Exercise 2D worked solutions (PDF)\">Exercise 2D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch2/Exercise%202E.pdf\" class=\"exercise\" aria-label=\"Exercise 2E worked solutions (PDF)\">Exercise 2E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch2/Mixed%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 2 worked solutions (PDF)\">Mixed Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"counting-and-overlap.html\">Counting and overlap<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-3\"><summary>3. The Normal Distribution<\/summary><div class=\"chapter-content\"><p>Sketch and shade the required region. Standardise with the standard deviation, then check which tail you need.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Exercise%203A.pdf\" class=\"exercise\" aria-label=\"Exercise 3A worked solutions (PDF)\">Exercise 3A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Exercise%203B.pdf\" class=\"exercise\" aria-label=\"Exercise 3B worked solutions (PDF)\">Exercise 3B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Exercise%203C.pdf\" class=\"exercise\" aria-label=\"Exercise 3C worked solutions (PDF)\">Exercise 3C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Exercise%203D.pdf\" class=\"exercise\" aria-label=\"Exercise 3D worked solutions (PDF)\">Exercise 3D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Exercise%203E.pdf\" class=\"exercise\" aria-label=\"Exercise 3E worked solutions (PDF)\">Exercise 3E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Exercise%203F.pdf\" class=\"exercise\" aria-label=\"Exercise 3F worked solutions (PDF)\">Exercise 3F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Exercise%203G.pdf\" class=\"exercise\" aria-label=\"Exercise 3G worked solutions (PDF)\">Exercise 3G<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch3/Mixed%20Exercise%203.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 3 worked solutions (PDF)\">Mixed Exercise 3<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"#question-1\">Normal-distribution practice check<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-4\"><summary>4. Moments<\/summary><div class=\"chapter-content\"><p>Extend modelling skills with clearly labelled historical physics and engineering questions.<\/p><
