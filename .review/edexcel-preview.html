=\"exercise\" aria-label=\"Exercise 8C worked solutions (PDF)\">Exercise 8C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch8/Exercise%208D.pdf\" class=\"exercise\" aria-label=\"Exercise 8D worked solutions (PDF)\">Exercise 8D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch8/Exercise%208E.pdf\" class=\"exercise\" aria-label=\"Exercise 8E worked solutions (PDF)\">Exercise 8E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Ch8/Mixed%20Exercise%208.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 8 worked solutions (PDF)\">Mixed Exercise 8<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"esat-paper-archive.html\">ESAT and physics practice<\/a>.<\/p><\/div><\/details><section id=\"review-solutions\" class=\"textbook-section\"><h2>Review &amp; practice-paper solutions<\/h2><h3>Review Exercises: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Rev/Review%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Review Exercise 1 worked solutions (PDF)\">Review Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Rev/Review%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Review Exercise 2 worked solutions (PDF)\">Review Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><h3>Practice Exam Paper: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/SM2/Prac/Practice%20Exam%20Paper.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper worked solutions (PDF)\">Practice Exam Paper<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/section><\/div><\/div><p class=\"textbook-credit\">Textbooks and linked SolutionBank materials: Pearson Education, accessed through <a href=\"https://www.physicsandmathstutor.com/maths-revision/solutionbanks/edexcel-statistics-mechanics-year-2/\">Physics &amp; Maths Tutor’s Edexcel SolutionBank<\/a>. Original practice questions, hints and explanations on this page: Arij Asad. This is an independent companion to the UK Edexcel 2017 series; match the chapter and exercise labels to your book. International A-level and older modular books use different numbering.<\/p><\/section>\n<section class=\"textbook-section\" id=\"practice\"><p class=\"topic-kicker\">Original practice by Arij Asad<\/p><h2>A short practice check<\/h2><p>Try these three questions before opening the hints. They sample a few useful skills; use them to choose what to revisit, rather than as a complete assessment of the book.<\/p><article class=\"practice-card\" id=\"question-1\"><div class=\"practice-head\"><h3>1. Normal distribution<\/h3><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X<\/mi><\/mrow><annotation encoding=\"application/x-tex\">X<\/annotation><\/semantics><\/math><\/span> is normally distributed with mean <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>50<\/mn><\/mrow><annotation encoding=\"application/x-tex\">50<\/annotation><\/semantics><\/math><\/span> and standard deviation <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">4<\/annotation><\/semantics><\/math><\/span>. Find <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>X<\/mi><mo>&gt;<\/mo><mn>54<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">P(X&gt;54)<\/annotation><\/semantics><\/math><\/span>, giving your answer to three significant figures.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Standardise using the standard deviation, then choose the upper tail.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>With <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z<\/mi><mo>=<\/mo><mo stretchy=\"false\">(<\/mo><mi>X<\/mi><mo>−<\/mo><mn>50<\/mn><mo stretchy=\"false\">)<\/mo><mi mathvariant=\"normal\">/<\/mi><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">Z=(X-50)/4<\/annotation><\/semantics><\/math><\/span>, the threshold <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>X<\/mi><mo>=<\/mo><mn>54<\/mn><\/mrow><annotation encoding=\"application/x-tex\">X=54<\/annotation><\/semantics><\/math><\/span> corresponds to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">Z=1<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Hence <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>X<\/mi><mo>&gt;<\/mo><mn>54<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>Z<\/mi><mo>&gt;<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mi mathvariant=\"normal\">Φ<\/mi><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>≈<\/mo><mn>0.158655<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(X&gt;54)=P(Z&gt;1)=1-\\Phi(1)\\approx0.158655<\/annotation><\/semantics><\/math><\/span>, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Φ<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\Phi<\/annotation><\/semantics><\/math><\/span> is the standard normal cumulative distribution function.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo>−<\/mo><mi mathvariant=\"normal\">Φ<\/mi><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>≈<\/mo><mn>0.159<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1-\\Phi(1)\\approx0.159<\/annotation><\/semantics><\/math><\/span> (three significant figures).<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-2\"><div class=\"practice-head\"><h3>2. Projectiles<\/h3><p>A particle is projected from level ground at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">m<\/mi><mtext> <\/mtext><msup><mi mathvariant=\"normal\">s<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">20\\,\\mathrm{m\\,s^{-1}}<\/annotation><\/semantics><\/math><\/span>, at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mn>30<\/mn><mo>∘<\/mo><\/msup><\/mrow><annotation encoding=\"application/x-tex\">30^\\circ<\/annotation><\/semantics><\/math><\/span> above the horizontal. Neglect air resistance and take <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g<\/mi><mo>=<\/mo><mn>9.8<\/mn><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">m<\/mi><mtext> <\/mtext><msup><mi mathvariant=\"normal\">s<\/mi><mrow><mo>−<\/mo><mn>2<\/mn><\/mrow><\/msup><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">g=9.8\\,\\mathrm{m\\,s^{-2}}<\/annotation><\/semantics><\/math><\/span>. Find its time of flight and horizontal range when it returns to the same level.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Resolve the initial velocity into components. Use zero vertical displacement to find the non-zero flight time.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>The initial horizontal and vertical velocity components are <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mi>cos<\/mi><mo>⁡<\/mo><msup><mn>30<\/mn><mo>∘<\/mo><\/msup><mo>=<\/mo><mn>10<\/mn><msqrt><mn>3<\/mn><\/msqrt><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">m<\/mi><mtext> <\/mtext><msup><mi mathvariant=\"normal\">s<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">20\\cos30^\\circ=10\\sqrt3\\,\\mathrm{m\\,s^{-1}}<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mi>sin<\/mi><mo>⁡<\/mo><msup><mn>30<\/mn><mo>∘<\/mo><\/msup><mo>=<\/mo><mn>10<\/mn><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">m<\/mi><mtext> <\/mtext><msup><mi mathvariant=\"normal\">s<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">20\\sin30^\\circ=10\\,\\mathrm{m\\,s^{-1}}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Taking upward as positive, vertical displacement is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>10<\/mn><mi>t<\/mi><mo>−<\/mo><mn>4.9<\/mn><msup><mi>t<\/mi><mn>2<\/mn><\/msup><\/mrow><annotation encoding=\"application/x-tex\">y=10t-4.9t^2<\/annotation><\/semantics><\/math><\/span>. At landing, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y=0<\/annotation><\/semantics><\/math><\/span>; the non-zero solution is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t<\/mi><mo>=<\/mo><mn>10<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>4.9<\/mn><mo>=<\/mo><mn>100<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>49<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">s<\/mi><mo>≈<\/mo><mn>2.04<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">s<\/mi><\/mrow><annotation encoding=\"application/x-tex\">t=10/4.9=100/49\\,\\mathrm{s}\\approx2.04\\,\\mathrm{s}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Horizontal velocity is constant, so the range is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mn>10<\/mn><msqrt><mn>3<\/mn><\/msqrt><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mn>100<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>49<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1000<\/mn><msqrt><mn>3<\/mn><\/msqrt><mi mathvariant=\"normal\">/<\/mi><mn>49<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><mo>≈<\/mo><mn>35.3<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">(10\\sqrt3)(100/49)=1000\\sqrt3/49\\,\\mathrm{m}\\approx35.3\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> Time <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mn>100<\/mn><mn>49<\/mn><\/mfrac><\/mstyle><mtext> <\/mtext><mi mathvariant=\"normal\">s<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\dfrac{100}{49}\\,\\mathrm{s}<\/annotation><\/semantics><\/math><\/span>; range <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>1000<\/mn><msqrt><mn>3<\/mn><\/msqrt><\/mrow><mn>49<\/mn><\/mfrac><\/mstyle><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">\\dfrac{1000\\sqrt3}{49}\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span> (approximately <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.04<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">s<\/mi><\/mrow><annotation encoding=\"application/x-tex\">2.04\\,\\mathrm{s}<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>35.3<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">35.3\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span>).<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-3\"><div class=\"practice-head\"><h3>3. Moments and equilibrium<\/h3><p>A uniform horizontal beam <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><annotation encoding=\"application/x-tex\">AB<\/annotation><\/semantics><\/math><\/span> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">4\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span> long and weighs <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>40<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">40\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span>. It is supported at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><\/mrow><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math><\/span>. A further downward load of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>20<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">20\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span> acts <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">m<\/mi><\/mrow><annotation encoding=\"application/x-tex\">1\\,\\mathrm{m}<\/annotation><\/semantics><\/math><\/span> from <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math><\/span>. Find the upward reactions at the two supports.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>The beam's weight acts at its midpoint. Taking moments about one support eliminates its reaction.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>Let the upward reactions be <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R<\/mi><mi>A<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">R_A<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R<\/mi><mi>B<\/mi><\/msub><\/mrow><annotation encoding=\"application/x-tex\">R_B<\/annotation><\/semantics><\/math><\/span>. Vertical equilibrium gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R<\/mi><mi>A<\/mi><\/msub><mo>+<\/mo><msub><mi>R<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>40<\/mn><mo>+<\/mo><mn>20<\/mn><mo>=<\/mo><mn>60<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">R_A+R_B=40+20=60\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Taking moments about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4<\/mn><msub><mi>R<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>40<\/mn><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mn>20<\/mn><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>100<\/mn><\/mrow><annotation encoding=\"application/x-tex\">4R_B=40(2)+20(1)=100<\/annotation><\/semantics><\/math><\/span>. Therefore <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>25<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">R_B=25\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>It follows that <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R<\/mi><mi>A<\/mi><\/msub><mo>=<\/mo><mn>60<\/mn><mo>−<\/mo><mn>25<\/mn><mo>=<\/mo><mn>35<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">R_A=60-25=35\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R<\/mi><mi>A<\/mi><\/msub><mo>=<\/mo><mn>35<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">R_A=35\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>25<\/mn><mtext> <\/mtext><mi mathvariant=\"normal\">N<\/mi><\/mrow><annotation encoding=\"application/x-tex\">R_B=25\\,\\mathrm{N}<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"find-the-mistake\"><div class=\"practice-head\"><h3>Find the mistake<\/h3><p>Events <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">A<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><\/mrow><annotation encoding=\"application/x-tex\">B<\/annotation><\/semantics><\/math><\/span> satisfy <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A)=0.4<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.5<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(B)=0.5<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A\\cap B)=0.3<\/annotation><\/semantics><\/math><\/span>. A student writes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)=P(A)=0.4<\/annotation><\/semantics><\/math><\/span>. Explain why this is wrong and find the correct conditional probability.<\/p><\/div><div class=\"practice-body\"><details><summary>Show the correction<\/summary><div><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo>∣<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mi mathvariant=\"normal\">/<\/mi><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.3<\/mn><mi mathvariant=\"normal\">/<\/mi><mn>0.5<\/mn><mo>=<\/mo><mn>0.6<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A\\mid B)=P(A\\cap B)/P(B)=0.3/0.5=0.6<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The student's equality would hold for independent events. Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo stretchy=\"false\">)<\/mo><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.4<\/mn><mo stretchy=\"false\">(<\/mo><mn>0.5<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A)P(B)=0.4(0.5)=0.2<\/annotation><\/semantics><\/math><\/span>, which differs from <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P<\/mi><mo stretchy=\"false\">(<\/mo><mi>A<\/mi><mo>∩<\/mo><mi>B<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">P(A\\cap B)=0.3<\/annotation><\/semantics><\/math><\/span>; the events are not independent.<\/p><\/div><\/details><\/div><\/article><aside class=\"textbook-note\"><h3>Use what you found<\/h3><ol><li>For normal probabilities, draw and shade the required tail before entering values; distinguish variance from standard deviation.<\/li><li>For projectiles, keep separate horizontal and vertical equations linked by the same time.<\/li><li>For equilibrium, draw every force at its point of application and choose a moment centre that removes an unknown.<\/li><\/ol><\/aside><\/section>\n<section class=\"textbook-section\" id=\"downloads\"><h2>Take the practice into a lesson<\/h2><p>The printable sheet contains the questions first, followed by hints and full worked solutions. The editable LaTeX source is ready for Overleaf.<\/p><div class=\"download-row\"><a href=\"assets/textbook-practice/statistics-mechanics-year-2-practice.pdf\">Practice sheet &amp; solutions (PDF)<\/a><a href=\"assets/textbook-practice/edexcel-practice-overleaf.zip\" download>All six sheets for Overleaf (ZIP)<\/a><\/div><\/section><aside class=\"topic-tuition\"><div><h2>Specialist tuition and guided practice<\/h2><p>Individual online lessons, tailored problem sheets and structured practice between lessons, focused on the areas you need to strengthen.<\/p><\/div><a class=\"resource-button\" href=\"contact.html#enquiry-form\">Discuss your tuition package<\/a><\/aside><\/div><\/main>  <footer><div class=\"container footer-content\"><div><div class=\"footer-brand\">Arij Asad Maths<\/div><div>Specialist online mathematics tuition<\/div><\/div><div class=\"footer-links\"><a href=\"tuition.html\">Tuition<\/a><a href=\"resources.html\">Resources<\/a><a href=\"about.html\">About<\/a><a href=\"contact.html\">Contact<\/a><a href=\"privacy.html\">Privacy<\/a><a href=\"terms.html\">Terms<\/a><button class=\"cookie-settings-link\" type=\"button\" data-cookie-settings>Cookie settings<\/button><\/div><div>© 2026 Arij Asad Maths<\/div><\/div><\/footer>"},"edexcel-core-pure-1.html":{"label":"Core Pure 1","bodyClass":"resource-page topic-page textbook-page","html":"<a class=\"skip-link\" href=\"#main-content\">Skip to main content<\/a>  <header class=\"site-header\">\n    <div class=\"container nav\">\n      <a class=\"brand\" n id=\"main-content\"><header class=\"textbook-hero\"><div class=\"container\"><nav class=\"textbook-breadcrumbs\" aria-label=\"Breadcrumb\"><a href=\"resources.html\">Resources<\/a><span>/<\/span><a href=\"edexcel-textbook-companions.html\">Edexcel companions<\/a><\/nav><p class=\"topic-kicker\">Further mathematics · UK A-level<\/p><h1>Edexcel Core Pure 1<\/h1><p>Build fluency with complex numbers, matrices, vectors and mathematical proof. Find your chapter, open the matching worked solutions, and try a short practice check.<\/p><nav class=\"topic-jumps\" aria-label=\"Page sections\"><a href=\"#chapters\">Chapters &amp; solutions<\/a><a href=\"#practice\">Try the practice check<\/a><a href=\"#downloads\">Download the sheet<\/a><\/nav><\/div><\/header>\n<div class=\"container\"><nav class=\"book-switcher\" aria-label=\"Textbook companions\"><a href=\"edexcel-pure-year-1.html\">Pure Year 1<\/a><a href=\"edexcel-pure-year-2.html\">Pure Year 2<\/a><a href=\"edexcel-statistics-mechanics-year-1.html\">Statistics &amp; Mechanics Year 1<\/a><a href=\"edexcel-statistics-mechanics-year-2.html\">Statistics &amp; Mechanics Year 2<\/a><a href=\"edexcel-core-pure-1.html\" aria-current=\"page\">Core Pure 1<\/a><a href=\"edexcel-core-pure-2.html\">Core Pure 2<\/a><\/nav><section class=\"textbook-section\" id=\"chapters\"><h2>Chapters &amp; worked solutions<\/h2><p>Use your textbook for the questions. Every exercise button below opens the corresponding SolutionBank PDF.<\/p><div class=\"chapter-layout\"><aside class=\"chapter-menu\"><h3>Jump to a chapter<\/h3><nav aria-label=\"Chapters\"><a href=\"#chapter-1\">1. Complex Numbers<\/a><a href=\"#chapter-2\">2. Argand Diagrams<\/a><a href=\"#chapter-3\">3. Series<\/a><a href=\"#chapter-4\">4. Roots of Polynomials<\/a><a href=\"#chapter-5\">5. Volumes of Revolution<\/a><a href=\"#chapter-6\">6. Matrices<\/a><a href=\"#chapter-7\">7. Linear Transformations<\/a><a href=\"#chapter-8\">8. Proof by Induction<\/a><a href=\"#chapter-9\">9. Vectors<\/a><a href=\"#review-solutions\">Review &amp; practice papers<\/a><\/nav><\/aside><div class=\"chapter-list\"><details class=\"chapter\" id=\"chapter-1\" open><summary>1. Complex Numbers<\/summary><div class=\"chapter-content\"><p>Extend these methods through unfamiliar Further Maths problems.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch1/Exercise%201A.pdf\" class=\"exercise\" aria-label=\"Exercise 1A worked solutions (PDF)\">Exercise 1A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch1/Exercise%201B.pdf\" class=\"exercise\" aria-label=\"Exercise 1B worked solutions (PDF)\">Exercise 1B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch1/Exercise%201C.pdf\" class=\"exercise\" aria-label=\"Exercise 1C worked solutions (PDF)\">Exercise 1C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch1/Exercise%201D.pdf\" class=\"exercise\" aria-label=\"Exercise 1D worked solutions (PDF)\">Exercise 1D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch1/Exercise%201E.pdf\" class=\"exercise\" aria-label=\"Exercise 1E worked solutions (PDF)\">Exercise 1E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch1/Exercise%201F.pdf\" class=\"exercise\" aria-label=\"Exercise 1F worked solutions (PDF)\">Exercise 1F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch1/Mixed%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 1 worked solutions (PDF)\">Mixed Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"step-past-papers.html\">STEP papers and solutions<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-2\"><summary>2. Argand Diagrams<\/summary><div class=\"chapter-content\"><p>Extend these methods through unfamiliar Further Maths problems.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch2/Exercise%202A.pdf\" class=\"exercise\" aria-label=\"Exercise 2A worked solutions (PDF)\">Exercise 2A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch2/Exercise%202B.pdf\" class=\"exercise\" aria-label=\"Exercise 2B worked solutions (PDF)\">Exercise 2B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch2/Exercise%202C.pdf\" class=\"exercise\" aria-label=\"Exercise 2C worked solutions (PDF)\">Exercise 2C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch2/Exercise%202D.pdf\" class=\"exercise\" aria-label=\"Exercise 2D worked solutions (PDF)\">Exercise 2D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch2/Exercise%202E.pdf\" class=\"exercise\" aria-label=\"Exercise 2E worked solutions (PDF)\">Exercise 2E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch2/Exercise%202F.pdf\" class=\"exercise\" aria-label=\"Exercise 2F worked solutions (PDF)\">Exercise 2F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch2/Mixed%20Exercise%202.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 2 worked solutions (PDF)\">Mixed Exercise 2<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"step-past-papers.html\">STEP papers and solutions<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-3\"><summary>3. Series<\/summary><div class=\"chapter-content\"><p>Connect a formula with its terms and check the index range.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch3/Exercise%203A.pdf\" class=\"exercise\" aria-label=\"Exercise 3A worked solutions (PDF)\">Exercise 3A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch3/Exercise%203B.pdf\" class=\"exercise\" aria-label=\"Exercise 3B worked solutions (PDF)\">Exercise 3B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch3/Mixed%20Exercise%203.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 3 worked solutions (PDF)\">Mixed Exercise 3<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"sequences-and-series.html\">Sequences and series<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-4\"><summary>4. Roots of Polynomials<\/summary><div class=\"chapter-content\"><p>Practise spotting a useful structure before expanding.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch4/Exercise%204A.pdf\" class=\"exercise\" aria-label=\"Exercise 4A worked solutions (PDF)\">Exercise 4A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch4/Exercise%204B.pdf\" class=\"exercise\" aria-label=\"Exercise 4B worked solutions (PDF)\">Exercise 4B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch4/Exercise%204C.pdf\" class=\"exercise\" aria-label=\"Exercise 4C worked solutions (PDF)\">Exercise 4C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch4/Exercise%204D.pdf\" class=\"exercise\" aria-label=\"Exercise 4D worked solutions (PDF)\">Exercise 4D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch4/Exercise%204E.pdf\" class=\"exercise\" aria-label=\"Exercise 4E worked solutions (PDF)\">Exercise 4E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch4/Mixed%20Exercise%204.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 4 worked solutions (PDF)\">Mixed Exercise 4<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"algebra-and-factorisation.html\">Algebra and factorisation<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-5\"><summary>5. Volumes of Revolution<\/summary><div class=\"chapter-content\"><p>Check signs, turning points and the difference between signed integrals and area.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch5/Exercise%205A.pdf\" class=\"exercise\" aria-label=\"Exercise 5A worked solutions (PDF)\">Exercise 5A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch5/Exercise%205B.pdf\" class=\"exercise\" aria-label=\"Exercise 5B worked solutions (PDF)\">Exercise 5B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch5/Exercise%205C.pdf\" class=\"exercise\" aria-label=\"Exercise 5C worked solutions (PDF)\">Exercise 5C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch5/Exercise%205D.pdf\" class=\"exercise\" aria-label=\"Exercise 5D worked solutions (PDF)\">Exercise 5D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch5/Mixed%20Exercise%205.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 5 worked solutions (PDF)\">Mixed Exercise 5<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"calculus-and-graph-sketches.html\">Calculus and graph sketches<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-6\"><summary>6. Matrices<\/summary><div class=\"chapter-content\"><p>Extend these methods through unfamiliar Further Maths problems.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch6/Exercise%206A.pdf\" class=\"exercise\" aria-label=\"Exercise 6A worked solutions (PDF)\">Exercise 6A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch6/Exercise%206B.pdf\" class=\"exercise\" aria-label=\"Exercise 6B worked solutions (PDF)\">Exercise 6B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/ A-level/Edexcel-Solutionbanks/CP1/Ch7/Exercise%207B.pdf\" class=\"exercise\" aria-label=\"Exercise 7B worked solutions (PDF)\">Exercise 7B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch7/Exercise%207C.pdf\" class=\"exercise\" aria-label=\"Exercise 7C worked solutions (PDF)\">Exercise 7C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch7/Exercise%207D.pdf\" class=\"exercise\" aria-label=\"Exercise 7D worked solutions (PDF)\">Exercise 7D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch7/Exercise%207E.pdf\" class=\"exercise\" aria-label=\"Exercise 7E worked solutions (PDF)\">Exercise 7E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch7/Exercise%207F.pdf\" class=\"exercise\" aria-label=\"Exercise 7F worked solutions (PDF)\">Exercise 7F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch7/Mixed%20Exercise%207.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 7 worked solutions (PDF)\">Mixed Exercise 7<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"step-past-papers.html\">STEP papers and solutions<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-8\"><summary>8. Proof by Induction<\/summary><div class=\"chapter-content\"><p>Keep assumptions and conclusions separate in each step of a proof.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch8/Exercise%208A.pdf\" class=\"exercise\" aria-label=\"Exercise 8A worked solutions (PDF)\">Exercise 8A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch8/Exercise%208B.pdf\" class=\"exercise\" aria-label=\"Exercise 8B worked solutions (PDF)\">Exercise 8B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch8/Exercise%208C.pdf\" class=\"exercise\" aria-label=\"Exercise 8C worked solutions (PDF)\">Exercise 8C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch8/Mixed%20Exercise%208.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 8 worked solutions (PDF)\">Mixed Exercise 8<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"tmua-logic-proof.html\">Logic and proof<\/a>.<\/p><\/div><\/details><details class=\"chapter\" id=\"chapter-9\"><summary>9. Vectors<\/summary><div class=\"chapter-content\"><p>Start with a labelled sketch and check every geometric constraint.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch9/Exercise%209A.pdf\" class=\"exercise\" aria-label=\"Exercise 9A worked solutions (PDF)\">Exercise 9A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch9/Exercise%209B.pdf\" class=\"exercise\" aria-label=\"Exercise 9B worked solutions (PDF)\">Exercise 9B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Ch9/Exercise%209C.pdf\" class=\"exercise\" aria-label=\"Exercise 9C worked solutions (PDF)\">Exercise 9C<span class=\ ctice Exam Paper: worked solutions<\/h3><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP1/Prac/Practice%20Exam%20Paper.pdf\" class=\"mixed\" aria-label=\"Practice Exam Paper worked solutions (PDF)\">Practice Exam Paper<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><\/section><\/div><\/div><p class=\"textbook-credit\">Textbooks and linked SolutionBank materials: Pearson Education, accessed through <a href=\"https://www.physicsandmathstutor.com/maths-revision/solutionbanks/edexcel-core-pure-maths-1/\">Physics &amp; Maths Tutor’s Edexcel SolutionBank<\/a>. Original practice questions, hints and explanations on this page: Arij Asad. This is an independent companion to the UK Edexcel 2017 series; match the chapter and exercise labels to your book. International A-level and older modular books use different numbering.<\/p><\/section>\n<section class=\"textbook-section\" id=\"practice\"><p class=\"topic-kicker\">Original practice by Arij Asad<\/p><h2>A short practice check<\/h2><p>Try these three questions before opening the hints. They sample a few useful skills; use them to choose what to revisit, rather than as a complete assessment of the book.<\/p><article class=\"practice-card\" id=\"question-1\"><div class=\"practice-head\"><h3>1. Complex quadratic roots<\/h3><p>Solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>z<\/mi><mn>2<\/mn><\/msup><mo>−<\/mo><mn>4<\/mn><mi>z<\/mi><mo>+<\/mo><mn>13<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">z^2-4z+13=0<\/annotation><\/semantics><\/math><\/span>, giving both roots in the form <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a<\/mi><mo>+<\/mo><mi>b<\/mi><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">a+bi<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Complete the square and remember that <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>i<\/mi><mn>2<\/mn><\/msup><mo>=<\/mo><mo>−<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">i^2=-1<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>Completing the square gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo>−<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">)<\/mo><mn>2<\/mn><\/msup><mo>+<\/mo><mn>9<\/mn><mo>=<\/mo><mn>0<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(z-2)^2+9=0<\/annotation><\/semantics><\/math><\/span>, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mi>z<\/mi><mo>−<\/mo><mn>2<\/mn><msup><mo stretchy=\"false\">)<\/mo><mn>2<\/mn><\/msup><mo>=<\/mo><mo>−<\/mo><mn>9<\/mn><\/mrow><annotation encoding=\"application/x-tex\">(z-2)^2=-9<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Therefore <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>−<\/mo><mn>2<\/mn><mo>=<\/mo><mo>±<\/mo><mn>3<\/mn><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">z-2=\\pm3i<\/annotation><\/semantics><\/math><\/span>, giving the conjugate roots <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>+<\/mo><mn>3<\/mn><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">2+3i<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo>−<\/mo><mn>3<\/mn><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">2-3i<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>=<\/mo><mn>2<\/mn><mo>+<\/mo><mn>3<\/mn><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">z=2+3i<\/annotation><\/semantics><\/math><\/span> or <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z<\/mi><mo>=<\/mo><mn>2<\/mn><mo>−<\/mo><mn>3<\/mn><mi>i<\/mi><\/mrow><annotation encoding=\"application/x-tex\">z=2-3i<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-2\"><div class=\"practice-head\"><h3>2. Inverse matrices<\/h3><p>Find the inverse of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>2<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">M=\\begin{pmatrix}2&amp;1\\\\1&amp;1\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>, and use it to solve <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mo>=<\/mo><mn>7<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2x+y=7<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>+<\/mo><mi>y<\/mi><mo>=<\/mo><mn>4<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x+y=4<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>Calculate the determinant before applying the inverse formula for a two-by-two matrix.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>The determinant is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2<\/mn><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mn>1<\/mn><mo stretchy=\"false\">(<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">2(1)-1(1)=1<\/annotation><\/semantics><\/math><\/span>, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>M<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>2<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">M^{-1}=\\begin{pmatrix}1&amp;-1\\\\-1&amp;2\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The equations are <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M<\/mi><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mi>x<\/mi><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mi>y<\/mi><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>7<\/mn><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>4<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">M\\begin{pmatrix}x\\\\y\\end{pmatrix}=\\begin{pmatrix}7\\\\4\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>. Premultiplying by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>M<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msup><\/mrow><annotation encoding=\"application/x-tex\">M^{-1}<\/annotation><\/semantics><\/math><\/span> gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mi>x<\/mi><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mi>y<\/mi><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mn>7<\/mn><mo>−<\/mo><mn>4<\/mn><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo>−<\/mo><mn>7<\/mn><mo>+<\/mo><mn>8<\/mn><\/mrow><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>3<\/mn><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">\\begin{pmatrix}x\\\\y\\end{pmatrix}=\\begin{pmatrix}7-4\\\\-7+8\\end{pmatrix}=\\begin{pmatrix}3\\\\1\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>M<\/mi><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/msup><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mrow><mo>−<\/mo><mn>1<\/mn><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>2<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">M^{-1}=\\begin{pmatrix}1&amp;-1\\\\-1&amp;2\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x<\/mi><mo>=<\/mo><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">x=3<\/annotation><\/semantics><\/math><\/span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">y=1<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"question-3\"><div class=\"practice-head\"><h3>3. Proof by induction<\/h3><p>Prove by induction that <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munderover><mo>∑<\/mo><mrow><mi>r<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mi>n<\/mi><\/munderover><mi>r<\/mi><mo stretchy=\"false\">(<\/mo><mi>r<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mo stretchy=\"false\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\sum_{r=1}^{n}r(r+1)=\\frac{n(n+1)(n+2)}3<\/annotation><\/semantics><\/math><\/span> for every positive integer <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><div class=\"practice-body\"><details><summary>Show a hint<\/summary><div><p>After assuming the formula for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mi>k<\/mi><\/mrow><annotation encoding=\"application/x-tex\">n=k<\/annotation><\/semantics><\/math><\/span>, add the next term <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><annotation encoding=\"application/x-tex\">(k+1)(k+2)<\/annotation><\/semantics><\/math><\/span> and factorise.<\/p><\/div><\/details><details><summary>Show the full solution<\/summary><div><p>For <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n=1<\/annotation><\/semantics><\/math><\/span>, the left side is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1(2)=2<\/annotation><\/semantics><\/math><\/span> and the right side is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1<\/mn><mo stretchy=\"false\">(<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><mo>=<\/mo><mn>2<\/mn><\/mrow><annotation encoding=\"application/x-tex\">1(2)(3)/3=2<\/annotation><\/semantics><\/math><\/span>, so the statement is true.<\/p><p>Assume it is true for a positive integer <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k<\/mi><\/mrow><annotation encoding=\"application/x-tex\">k<\/annotation><\/semantics><\/math><\/span>: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mo>∑<\/mo><mrow><mi>r<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mi>k<\/mi><\/msubsup><mi>r<\/mi><mo stretchy=\"false\">(<\/mo><mi>r<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>k<\/mi><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mi mathvariant=\"normal\">/<\/mi><mn>3<\/mn><\/mrow><annotation encoding=\"application/x-tex\">\\sum_{r=1}^{k}r(r+1)=k(k+1)(k+2)/3<\/annotation><\/semantics><\/math><\/span>.<\/p><p>Then <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mtable rowspacing=\"0.25em\" columnalign=\"right left\" columnspacing=\"0em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><munderover><mo>∑<\/mo><mrow><mi>r<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mrow><mi>k<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/munderover><mi>r<\/mi><mo stretchy=\"false\">(<\/mo><mi>r<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><mfrac><mrow><mi>k<\/mi><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><mn>3<\/mn><\/mfrac><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mspace width=\"1em\"/><mo>+<\/mo><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><\/mrow><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mrow><mrow><\/mrow><mo>=<\/mo><mfrac><mrow><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>k<\/mi><mo>+<\/mo><mn>3<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><mn>3<\/mn><\/mfrac><mi mathvariant=\"normal\">.<\/mi><\/mrow><\/mstyle><\/mtd><\/mtr><\/mtable><annotation encoding=\"application/x-tex\">\\begin{aligned}\\sum_{r=1}^{k+1}r(r+1)&amp;=\\frac{k(k+1)(k+2)}3\\\\&amp;\\quad +(k+1)(k+2)\\\\&amp;=\\frac{(k+1)(k+2)(k+3)}3.\\end{aligned}<\/annotation><\/semantics><\/math><\/span><\/p><p>This is the required formula with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mi>k<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n=k+1<\/annotation><\/semantics><\/math><\/span>. The statement holds at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><annotation encoding=\"application/x-tex\">n=1<\/annotation><\/semantics><\/math><\/span>, and truth at any positive integer implies truth at the next; therefore it holds for every positive integer by induction.<\/p><p><strong>Answer:<\/strong> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><munderover><mo>∑<\/mo><mrow><mi>r<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mi>n<\/mi><\/munderover><mi>r<\/mi><mo stretchy=\"false\">(<\/mo><mi>r<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mfrac><mrow><mi>n<\/mi><mo stretchy=\"false\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">(<\/mo><mi>n<\/mi><mo>+<\/mo><mn>2<\/mn><mo stretchy=\"false\">)<\/mo><\/mrow><mn>3<\/mn><\/mfrac><\/mstyle><\/mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\sum_{r=1}^{n}r(r+1)=\\dfrac{n(n+1)(n+2)}3<\/annotation><\/semantics><\/math><\/span> for all positive integers <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n<\/mi><\/mrow><annotation encoding=\"application/x-tex\">n<\/annotation><\/semantics><\/math><\/span>.<\/p><\/div><\/details><\/div><\/article><article class=\"practice-card\" id=\"find-the-mistake\"><div class=\"practice-head\"><h3>Find the mistake<\/h3><p>Let <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>0<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">A=\\begin{pmatrix}1&amp;1\\\\0&amp;1\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>2<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>0<\/mn><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>0<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">B=\\begin{pmatrix}2&amp;0\\\\0&amp;1\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>. A student assumes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mo>=<\/mo><mi>B<\/mi><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">AB=BA<\/annotation><\/semantics><\/math><\/span>, as for ordinary numbers. Calculate both products to check the claim.<\/p><\/div><div class=\"practice-body\"><details><summary>Show the correction<\/summary><div><p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>2<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>0<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">AB=\\begin{pmatrix}2&amp;1\\\\0&amp;1\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>, whereas <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B<\/mi><mi>A<\/mi><mo>=<\/mo><mrow><mo fence=\"true\">(<\/mo><mtable rowspacing=\"0.16em\" columnalign=\"center center\" columnspacing=\"1em\"><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>2<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>2<\/mn><\/mstyle><\/mtd><\/mtr><mtr><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>0<\/mn><\/mstyle><\/mtd><mtd><mstyle scriptlevel=\"0\" displaystyle=\"false\"><mn>1<\/mn><\/mstyle><\/mtd><\/mtr><\/mtable><mo fence=\"true\">)<\/mo><\/mrow><\/mrow><annotation encoding=\"application/x-tex\">BA=\\begin{pmatrix}2&amp;2\\\\0&amp;1\\end{pmatrix}<\/annotation><\/semantics><\/math><\/span>.<\/p><p>The top-right entries differ, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A<\/mi><mi>B<\/mi><mo mathvariant=\"normal\">≠<\/mo><mi>B<\/mi><mi>A<\/mi><\/mrow><annotation encoding=\"application/x-tex\">AB\\neq BA<\/annotation><\/semantics><\/math><\/span>. Matrix multiplication is not commutative in general; factors cannot be reordered without justification.<\/p><\/div><\/details><\/div><\/article><aside class=\"textbook-note\"><h3>Use what you found<\/h3><ol><li>Check complex roots by substitution and use an Argand sketch to connect algebra with geometry.<\/li><li>When using matrices, preserve multiplication order and verify an inverse by multiplying back to the identity.<\/li><li>Write induction proofs with a base case, a clearly stated assumption, the next-step calculation and a conclusion.<\/li><\/ol><\/aside><\/section>\n<section class=\"textbook-section\" id=\"downloads\"><h2>Take the practice into a lesson<\/h2><p>The printable sheet contains the questions first, followed by hints and full worked solutions. The editable LaTeX source is ready for Overleaf.<\/p><div class=\"download-row\"><a href=\"assets/textbook-practice/core-pure-1-practice.pdf\">Practice sheet &amp; solutions (PDF)<\/a><a href=\"assets/textbook-practice/edexcel-practice-overleaf.zip\" download>All six sheets for Overleaf (ZIP)<\/a><\/div><\/section><aside class=\"topic-tuition\"><div><h2>Specialist tuition and guided practice<\/h2><p>Individual online lessons, tailored problem sheets and structured practice between lessons, focused on the areas you need to strengthen.<\/p><\/div><a class=\"resource-button\" href=\"contact.html#enquiry-form\">Discuss your tuition package<\/a><\/aside><\/div><\/main>  <footer><div class=\"container footer-content\"><div><div class=\"footer-brand\">Arij Asad Maths<\/div><div>Specialist online mathematics tuition<\/div><\/div><div class=\"footer-links\"><a href=\"tuition.html\">Tuition<\/a><a href=\"resources.html\">Resources<\/a><a href=\"about.html\">About<\/a><a href=\"contact.html\">Contact<\/a><a href=\"privacy.html\">Privacy<\/a><a href=\"terms.html\">Terms<\/a><button class=\"cookie-settings-link\" type=\"button\" data-cookie-settings>Cookie settings<\/button><\/div><div>© 2026 Arij Asad Maths<\/div><\/div><\/footer>"},"edexcel-core-pure-2.html":{"label":"Core Pure 2","bodyClass":"resource-page topic-page textbook-page","html":"<a class=\"skip-link\" href=\"#main-content\">Skip to main content<\/a>  <header class=\"site-header\">\n    <div class=\"container nav\">\n      <a class=\"brand\" href=\"/\">Arij Asad <span>Maths<\/span><\/a>\n      <button class=\"menu-button\" type=\"button\" aria-expanded=\"false\" aria-controls=\"main-navigation\">Menu<\/button>\n      <nav class=\"nav-links\" id=\"main-navigation\" aria-label=\"Main navigation\">\n        <a href=\"/\">Home<\/a><a href=\"about.html\">About<\/a><a href=\"tuition.html\">Tuition<\/a>\n        <a href=\"tmua.html\">TMUA<\/a><a href=\"step.html\">STEP<\/a><a href=\"interviews.html\">Interviews<\/a>\n        <a href=\"maths-challenges.html\">Challenges<\/a>\n        <a href=\"university-maths.html\">University<\/a>\n        <a href=\"resources.html\">Resources<\/a><a href=\"zh.html\">中文<\/a>\n        <a class=\"nav-contact\" href=\"contact.html\">Contact<\/a>\n      <\/nav>\n    <\/div>\n  <\/header>\n  <!-- Shared past-paper navigation -->\n  <nav class=\"paper-archive-bar\" aria-label=\"Past paper archives\">\n    <div class=\"paper-archive-bar__inner\">\n      <span class=\"paper-archive-bar__label\">Past paper archives<\/span>\n      <div class=\"paper-archive-bar__links\"><a href=\"/tmua-paper-archive.html\" aria-label=\"TMUA paper archive\">TMUA<\/a><a href=\"/mat-past-papers.html\" aria-label=\"MAT paper archive\">MAT<\/a><a href=\"/step-past-papers.html\" aria-label=\"STEP paper archive\">STEP<\/a><a href=\"/esat-paper-archive.html\" aria-label=\"ESAT paper archive\">ESAT<\/a><a href=\"/jmc-past-papers.html\" aria-label=\"JMC paper archive\">JMC<\/a><a href=\"/imc-past-papers.html\" aria-label=\"IMC paper archive\">IMC<\/a><a href=\"/smc-past-papers.html\" aria-label=\"SMC paper archive\">SMC<\/a><a href=\"/amc10-past-papers.html\" aria-label=\"AMC 10 paper archive\">AMC 10<\/a><a href=\"/amc12-past-papers.html\" aria-label=\"AMC 12 paper archive\">AMC 12<\/a><a href=\"/aime-past-papers.html\" aria-label=\"AIME paper archive\">AIME<\/a><a href=\"/bmo-past-papers.html\" aria-label=\"BMO paper archive\">BMO<\/a><\/div>\n    <\/div>\n  <\/nav>\n  <!-- /Shared past-paper navigation --><main id=\"main-content\"><header class=\"textbook-hero\"><div class=\"container\"><nav class=\"textbook-breadcrumbs\" aria-label=\"Breadcrumb\"><a href=\"resources.html\">Resources<\/a><span>/<\/span><a href=\"edexcel-textbook-companions.html\">Edexcel companions<\/a><\/nav><p class=\"topic-kicker\">Further mathematics · UK A-level<\/p><h1>Edexcel Core Pure 2<\/h1><p>Develop complex-number methods, polar coordinates and differential equations. Find your chapter, open the matching worked solutions, and try a short practice check.<\/p><nav class=\"topic-jumps\" aria-label=\"Page sections\"><a href=\"#chapters\">Chapters &amp; solutions<\/a><a href=\"#practice\">Try the practice check<\/a><a href=\"#downloads\">Download the sheet<\/a><\/nav><\/div><\/header>\n<div class=\"container\"><nav class=\"book-switcher\" aria-label=\"Textbook companions\"><a href=\"edexcel-pure-year-1.html\">Pure Year 1<\/a><a href=\"edexcel-pure-year-2.html\">Pure Year 2<\/a><a href=\"edexcel-statistics-mechanics-year-1.html\">Statistics &amp; Mechanics Year 1<\/a><a href=\"edexcel-statistics-mechanics-year-2.html\">Statistics &amp; Mechanics Year 2<\/a><a href=\"edexcel-core-pure-1.html\">Core Pure 1<\/a><a href=\"edexcel-core-pure-2.html\" aria-current=\"page\">Core Pure 2<\/a><\/nav><section class=\"textbook-section\" id=\"chapters\"><h2>Chapters &amp; worked solutions<\/h2><p>Use your textbook for the questions. Every exercise button below opens the corresponding SolutionBank PDF.<\/p><div class=\"chapter-layout\"><aside class=\"chapter-menu\"><h3>Jump to a chapter<\/h3><nav aria-label=\"Chapters\"><a href=\"#chapter-1\">1. Complex Numbers<\/a><a href=\"#chapter-2\">2. Series<\/a><a href=\"#chapter-3\">3. Methods in Calculus<\/a><a href=\"#chapter-4\">4. Volumes of Revolution<\/a><a href=\"#chapter-5\">5. Polar Coordinates<\/a><a href=\"#chapter-6\">6. Hyperbolic Functions<\/a><a href=\"#chapter-7\">7. Methods in Differential Equations<\/a><a href=\"#chapter-8\">8. Modelling with Differential Equations<\/a><a href=\"#review-solutions\">Review &amp; practice papers<\/a><\/nav><\/aside><div class=\"chapter-list\"><details class=\"chapter\" id=\"chapter-1\" open><summary>1. Complex Numbers<\/summary><div class=\"chapter-content\"><p>Extend these methods through unfamiliar Further Maths problems.<\/p><div class=\"exercise-links\"><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Exercise%201A.pdf\" class=\"exercise\" aria-label=\"Exercise 1A worked solutions (PDF)\">Exercise 1A<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Exercise%201B.pdf\" class=\"exercise\" aria-label=\"Exercise 1B worked solutions (PDF)\">Exercise 1B<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Exercise%201C.pdf\" class=\"exercise\" aria-label=\"Exercise 1C worked solutions (PDF)\">Exercise 1C<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Exercise%201D.pdf\" class=\"exercise\" aria-label=\"Exercise 1D worked solutions (PDF)\">Exercise 1D<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Exercise%201E.pdf\" class=\"exercise\" aria-label=\"Exercise 1E worked solutions (PDF)\">Exercise 1E<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Exercise%201F.pdf\" class=\"exercise\" aria-label=\"Exercise 1F worked solutions (PDF)\">Exercise 1F<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Exercise%201G.pdf\" class=\"exercise\" aria-label=\"Exercise 1G worked solutions (PDF)\">Exercise 1G<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><a href=\"https://pmt.physicsandmathstutor.com/download/Maths/A-level/Edexcel-Solutionbanks/CP2/Ch1/Mixed%20Exercise%201.pdf\" class=\"mixed\" aria-label=\"Mixed Exercise 1 worked solutions (PDF)\">Mixed Exercise 1<span class=\"sr-only\"> worked solutions (PDF)<\/span><\/a><\/div><p class=\"practice-route\">Further practice: <a href=\"step-past-
